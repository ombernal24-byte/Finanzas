<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Finanzas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='11' fill='url(%23g)'/><defs><linearGradient id='g' x1='0' y1='0' x2='40' y2='40' gradientUnits='userSpaceOnUse'><stop offset='0%25' stop-color='%230A84FF'/><stop offset='100%25' stop-color='%23BF5AF2'/></linearGradient></defs><rect x='9' y='24' width='5' height='9' rx='2.5' fill='white'/><rect x='17.5' y='18' width='5' height='15' rx='2.5' fill='white'/><rect x='26' y='12' width='5' height='21' rx='2.5' fill='white'/><circle cx='28.5' cy='10' r='2.2' fill='white'/></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ── TEMA OSCURO (default) ── */
:root{
  --green:#30D158;--red:#FF453A;--blue:#0A84FF;--orange:#FF9F0A;--purple:#BF5AF2;
  --bg:linear-gradient(140deg,#07071a 0%,#0d0920 45%,#190830 100%);
  --body-bg:#07071a;
  --text:#ffffff;--text2:rgba(255,255,255,0.55);--text3:rgba(255,255,255,0.30);
  --card:rgba(255,255,255,0.07);--card-b:rgba(255,255,255,0.12);
  --sep:rgba(255,255,255,0.08);
  --tabbar-bg:rgba(8,8,22,0.85);
  --sheet-bg:rgba(20,18,36,0.97);
  --input-bg:rgba(255,255,255,0.08);--input-b:rgba(255,255,255,0.14);
  --chip-bg:rgba(255,255,255,0.05);--chip-b:rgba(255,255,255,0.14);
  --del-bg:rgba(255,69,58,.15);
  --handle-bg:rgba(255,255,255,0.22);
  --prog-track:rgba(255,255,255,0.09);
  --icon-btn-bg:rgba(255,255,255,0.10);
  --icon-btn-fg:#ffffff;
  --arc-card-bg:rgba(255,255,255,0.04);
  --select-bg:#14121f;
  --canvas-text:rgba(255,255,255,0.40);
  --canvas-legend:rgba(255,255,255,0.60);
  --canvas-grid:rgba(255,255,255,0.07);
  --donut-track:rgba(255,255,255,0.07);
  --donut-text:#ffffff;
  --donut-sub:rgba(255,255,255,0.45);
  --tab-h:60px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}

/* ── TEMA CLARO ── */
@media(prefers-color-scheme:light){
  :root{
    --bg:linear-gradient(140deg,#eef2ff 0%,#f0eaff 50%,#e8f4ff 100%);
    --body-bg:#f2f2f7;
    --text:#1c1c1e;--text2:rgba(0,0,0,0.45);--text3:rgba(0,0,0,0.25);
    --card:rgba(255,255,255,0.72);--card-b:rgba(0,0,0,0.07);
    --sep:rgba(0,0,0,0.07);
    --tabbar-bg:rgba(242,242,247,0.88);
    --sheet-bg:rgba(248,248,252,0.98);
    --input-bg:rgba(0,0,0,0.05);--input-b:rgba(0,0,0,0.12);
    --chip-bg:rgba(0,0,0,0.04);--chip-b:rgba(0,0,0,0.12);
    --del-bg:rgba(255,69,58,.10);
    --handle-bg:rgba(0,0,0,0.15);
    --prog-track:rgba(0,0,0,0.08);
    --icon-btn-bg:rgba(0,0,0,0.07);
    --icon-btn-fg:#1c1c1e;
    --arc-card-bg:rgba(255,255,255,0.65);
    --select-bg:#ffffff;
    --canvas-text:rgba(0,0,0,0.45);
    --canvas-legend:rgba(0,0,0,0.55);
    --canvas-grid:rgba(0,0,0,0.07);
    --donut-track:rgba(0,0,0,0.07);
    --donut-text:#1c1c1e;
    --donut-sub:rgba(0,0,0,0.40);
  }
}

html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
  background:var(--bg);background-color:var(--body-bg);
  background-attachment:fixed;color:var(--text);-webkit-font-smoothing:antialiased;
}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--st)}
#content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(var(--tab-h) + var(--sb) + 22px);
  -webkit-overflow-scrolling:touch;
}
#tabbar{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--tab-h) + var(--sb));padding-bottom:var(--sb);
  display:flex;
  background:var(--tabbar-bg);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--sep);z-index:100;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;color:var(--text2);
  font-size:10px;font-weight:500;cursor:pointer;padding:0;
}
.tab-btn.on{color:var(--blue)}
.tab-btn svg{width:22px;height:22px}
#fab{
  position:fixed;right:20px;bottom:calc(var(--tab-h) + var(--sb) + 18px);
  width:54px;height:54px;border-radius:50%;
  background:var(--blue);border:none;color:#fff;
  font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 28px rgba(10,132,255,0.5);cursor:pointer;z-index:101;
  transition:transform .15s,box-shadow .15s;
}
#fab:active{transform:scale(.92);box-shadow:0 2px 14px rgba(10,132,255,0.4)}
.pg-head{padding:22px 20px 10px;display:flex;align-items:center;justify-content:space-between}
.pg-title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.pg-title span{background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pg-sub{font-size:13px;color:var(--text2);margin-top:3px;font-weight:500}
.card{
  background:var(--card);border:1px solid var(--card-b);border-radius:20px;
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  margin:0 14px 12px;padding:18px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.card-ttl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text2);margin-bottom:12px}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 12px}
.kpi{
  background:var(--card);border:1px solid var(--card-b);border-radius:16px;
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.kpi-lbl{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:2px}
.tx-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep)}
.tx-item:last-child{border-bottom:none}
.tx-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:12px;color:var(--text2);margin-top:1px}
.tx-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.tx-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0;opacity:.7}
.prog-wrap{margin-bottom:14px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.prog-name{font-size:14px;font-weight:500}
.prog-amt{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.prog-bg{height:6px;background:var(--prog-track);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s ease}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--sep)}
.sum-row:last-child{border-bottom:none}
.sum-lbl{font-size:14px;color:var(--text2)}
.sum-val{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.rule-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--sep)}
.rule-row:last-child{border-bottom:none}
.rule-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rule-lbl{flex:1;font-size:14px}
.rule-tgt{font-size:12px;color:var(--text3)}
.rule-pct{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.rule-ico{font-size:16px;flex-shrink:0}
.donut-wrap{display:flex;gap:16px;align-items:center}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:12px}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-name{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-pct{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.overlay.on{opacity:1;pointer-events:all}
.sheet{
  width:100%;background:var(--sheet-bg);
  backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid var(--card-b);border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + var(--sb));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:90vh;overflow-y:auto;
}
.overlay.on .sheet{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--handle-bg);margin:0 auto 18px}
.modal-ttl{font-size:18px;font-weight:700;margin-bottom:18px;text-align:center}
.fgroup{margin-bottom:14px}
.flbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);display:block;margin-bottom:6px}
.finput{
  width:100%;background:var(--input-bg);border:1px solid var(--input-b);
  border-radius:12px;color:var(--text);font-size:16px;padding:12px 14px;outline:none;
  font-family:inherit;-webkit-appearance:none;transition:border-color .18s;
}
.finput:focus{border-color:var(--blue)}
.finput::placeholder{color:var(--text3)}
select.finput option{background:var(--select-bg)}
.type-tgl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.type-btn{
  padding:11px;border-radius:12px;border:1px solid var(--chip-b);
  background:var(--chip-bg);color:var(--text2);
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;
}
.type-btn.tg-gasto{background:rgba(255,69,58,.18);border-color:var(--red);color:var(--red)}
.type-btn.tg-ingreso{background:rgba(48,209,88,.18);border-color:var(--green);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{
  padding:7px 12px;border-radius:20px;border:1px solid var(--chip-b);
  background:var(--chip-bg);color:var(--text2);font-size:13px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip.on{background:rgba(10,132,255,.22);border-color:var(--blue);color:var(--blue)}
.btn-main{
  width:100%;padding:14px;border-radius:14px;border:none;
  background:var(--blue);color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-top:8px;transition:opacity .15s;
}
.btn-main:active{opacity:.8}
.btn-add{
  padding:9px 14px;border-radius:10px;border:1px dashed var(--handle-bg);
  background:none;color:var(--text2);font-size:13px;cursor:pointer;
  font-family:inherit;width:100%;margin-top:4px;
}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:none;
  background:var(--icon-btn-bg);color:var(--icon-btn-fg);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;
}
.cfg-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.cfg-tabs::-webkit-scrollbar{display:none}
.cfg-tab{
  padding:7px 14px;border-radius:20px;border:1px solid var(--chip-b);
  background:none;color:var(--text2);font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;font-family:inherit;
}
.cfg-tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cfg-row .finput{margin:0}
.cfg-nm{flex:1}
.cfg-amt{width:120px;flex-shrink:0}
.cfg-del{
  width:32px;height:32px;border-radius:8px;border:none;
  background:rgba(255,69,58,.15);color:var(--red);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.arc-card{
  background:var(--arc-card-bg);border:1px solid var(--sep);
  border-radius:16px;padding:14px;margin:0 14px 10px;
}
.month-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.28);
  border-radius:20px;padding:4px 10px;font-size:12px;color:var(--blue);font-weight:600;
}
.empty-st{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-ico{font-size:44px;margin-bottom:10px}
.empty-tx{font-size:15px;font-weight:500}
.empty-sub{font-size:13px;margin-top:5px;color:var(--text3)}
body.modal-open #content{overflow:hidden}
/* ── TOASTS ── */
#toast-cnt{position:fixed;top:calc(var(--st) + 14px);left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:380px}
.toast{padding:13px 18px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:toastIn .3s cubic-bezier(.32,.72,0,1);box-shadow:0 6px 24px rgba(0,0,0,.22)}
.toast-warn{background:rgba(255,159,10,.96);color:#fff}
.toast-danger{background:rgba(255,69,58,.96);color:#fff}
.toast-ok{background:rgba(48,209,88,.96);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
/* ── METAS ── */
.meta-card{background:var(--card);border:1px solid var(--card-b);border-radius:18px;margin:0 14px 12px;padding:16px;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
/* ── AMORT ── */
.amort-tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.amort-tbl th{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text2);padding:6px 8px;text-align:right;border-bottom:1px solid var(--sep)}
.amort-tbl th:first-child,.amort-tbl td:first-child{text-align:center}
.amort-tbl td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--sep)}
.amort-tbl tr:last-child td{border-bottom:none}
.amort-tbl tr.hi-row td{background:rgba(10,132,255,.08)}
/* ── ANIMACIONES ── */
#content{transition:opacity .18s ease,transform .18s ease}
.card{transition:transform .12s ease,box-shadow .12s ease}
.card:active{transform:scale(.985)}
.tx-item{transition:background .12s ease}
.tx-item:active{background:var(--chip-bg)}
.tab-btn{transition:color .18s ease,transform .12s ease}
.tab-btn:active{transform:scale(.9)}
.btn-main{transition:transform .1s ease,box-shadow .1s ease}
.btn-main:active{transform:scale(.97)}
.sheet{transition:transform .3s cubic-bezier(.25,.8,.25,1)}
.legend-item{transition:background .12s ease}
/* ── PRINT ── */
@media print{
  #tabbar,#fab,#toast-cnt,.overlay,button{display:none!important}
  body{background:#fff!important;color:#000!important;overflow:auto!important}
  .card,.kpi,.arc-card,.meta-card{background:#fff!important;border:1px solid #ddd!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  #content{overflow:visible!important;padding-bottom:0!important}
  #app{height:auto!important;overflow:visible!important}
}
/* Widget system */
.widget-card{position:relative;cursor:pointer;transition:transform .2s,opacity .2s}
.widget-card:active{transform:scale(.98);opacity:.9}
.widget-edit-mode .widget-card{animation:wiggle 1.8s ease-in-out infinite}
.widget-edit-mode .widget-card:nth-child(even){animation-delay:.15s}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-.4deg)}75%{transform:rotate(.4deg)}}
.widget-badge{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--body-bg);display:flex;align-items:center;justify-content:center;font-size:11px;z-index:10;cursor:pointer;transition:transform .2s}
.widget-badge:active{transform:scale(.85)}
.widget-toggle-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--sep)}
.widget-toggle-item:last-child{border-bottom:none}
/* Toggle switch */
.sw{width:44px;height:26px;background:var(--prog-track);border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.sw.on{background:var(--green)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on::after{transform:translateX(18px)}
/* Detail modal */
.detail-sheet{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.detail-sheet.open{pointer-events:all}
.detail-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s;backdrop-filter:blur(4px)}
.detail-sheet.open .detail-overlay{opacity:1}
.detail-body{background:var(--sheet-bg);border-radius:24px 24px 0 0;padding:16px 20px max(28px,var(--sb)) 20px;max-height:80vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,1.06,.56,1)}
.detail-sheet.open .detail-body{transform:translateY(0)}
.detail-ttl{font-size:18px;font-weight:800;margin-bottom:4px}
.detail-sub{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.5}
.detail-section{background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:14px;margin-bottom:10px}
.detail-section-ttl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin-bottom:8px}
/* Slide-in stagger for dashboard cards */
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.widget-card{animation:slideUp .4s ease both}
.widget-card:nth-child(1){animation-delay:.04s}
.widget-card:nth-child(2){animation-delay:.08s}
.widget-card:nth-child(3){animation-delay:.12s}
.widget-card:nth-child(4){animation-delay:.16s}
.widget-card:nth-child(5){animation-delay:.20s}
.widget-card:nth-child(6){animation-delay:.24s}
.widget-card:nth-child(7){animation-delay:.28s}
.widget-card:nth-child(8){animation-delay:.32s}
</style>
</head>
<body>

<div id="app">
  <div id="content"></div>
  <nav id="tabbar">
    <button class="tab-btn on" onclick="goTab('dash')" id="t-dash">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="9,22 9,12 15,12 15,22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Inicio
    </button>
    <button class="tab-btn" onclick="goTab('gastos')" id="t-gastos">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h20" stroke="currentColor" stroke-width="1.8"/></svg>
      Gastos

<script>
const SK='finanzas_v2';
const DEF_CATS=[
  {k:'transporte',       l:'Transporte/Gasolina',    ic:'🚗',col:'#FF9F0A'},
  {k:'alimentacionMkt',  l:'Alimentación-Mercado',   ic:'🛒',col:'#30D158'},
  {k:'alimentacionRst',  l:'Alimentación-Rest.',     ic:'🍽️',col:'#FF6B35'},
  {k:'tarjeta',          l:'Tarjeta Crédito',        ic:'💳',col:'#BF5AF2'},
  {k:'ahorro',           l:'Ahorro e Inversión',     ic:'💰',col:'#0A84FF'},
  {k:'entretenimiento',  l:'Entretenimiento',        ic:'🎮',col:'#FF453A'},
  {k:'ropa',             l:'Ropa',                   ic:'👗',col:'#FF2D92'},
  {k:'mascotas',         l:'Mascotas',               ic:'🐾',col:'#FF9F0A'},
  {k:'personal',         l:'Personal/Hogar',         ic:'🧴',col:'#32ADE6'},
  {k:'otro',             l:'Otro',                   ic:'📌',col:'#8E8E93'},
];
function CATS(){return S.cats&&S.cats.length?S.cats:DEF_CATS;}

function defState(){
  return{
    config:{
      ingresos:[{n:'Salario',m:0}],
      gastosFijos:[{n:'Arriendo',m:0}],
      deudas:[{n:'Crédito Libre Destino',c:0,saldo:0,tasa:0},{n:'Crédito Vehículo',c:0,saldo:0,tasa:0}],
      presup:{transporte:0,alimentacionMkt:0,alimentacionRst:0,tarjeta:0,ahorro:0,entretenimiento:0,ropa:0,mascotas:0,personal:0},
      quincenas:{activo:false,q1:0,q2:0},
      recurrentes:[],
      widgets:{},
      efectivoBal:0
    },
    meses:{},archivos:{},cats:[],metas:[],cuentas:[],lastMk:mk()
  };
}

let S=defState();

function mk(d){const x=d||new Date();return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;}

function load(){
  try{const r=localStorage.getItem(SK);if(r){const p=JSON.parse(r);S={...defState(),...p};S.config={...defState().config,...p.config};S.config.presup={...defState().config.presup,...(p.config?.presup||{})};if(!('mascotas' in S.config.presup))S.config.presup.mascotas=0;if(!('personal' in S.config.presup))S.config.presup.personal=0;S.config.quincenas={...defState().config.quincenas,...(p.config?.quincenas||{})};if(!S.cats||!S.cats.length)S.cats=DEF_CATS.map(c=>({...c}));if(!S.metas)S.metas=[];if(!S.config.recurrentes)S.config.recurrentes=[];S.config.deudas=(S.config.deudas||[]).map(d=>({saldo:0,tasa:0,abonos:[],...d}));if(!S.cuentas)S.cuentas=[];S.cuentas=S.cuentas.map(c=>({tipo:'cuenta',...c}));if(!('efectivoBal' in S.config))S.config.efectivoBal=0;}}catch(e){}
}

function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}

function checkArchive(){
  const cur=mk();
  if(S.lastMk&&S.lastMk!==cur){
    const prev=S.meses[S.lastMk];
    if(prev&&prev.txns&&prev.txns.length>0){S.archivos[S.lastMk]={txns:prev.txns,snap:calcSnap(S.lastMk,prev.txns)};delete S.meses[S.lastMk];}
    S.lastMk=cur;save();
  }
  if(!S.meses[cur]){S.meses[cur]={txns:[]};save();}
}

function calcSnap(m,txns){
  const ing=txns.filter(t=>t.tp==='Ingreso').reduce((s,t)=>s+t.mo,0);
  const gas=txns.filter(t=>t.tp==='Gasto').reduce((s,t)=>s+t.mo,0);
  const byCat={};CATS().forEach(c=>{byCat[c.k]=txns.filter(t=>t.tp==='Gasto'&&t.cat===c.k).reduce((s,t)=>s+t.mo,0);});
  return{ing,gas,byCat};
}

function txns(){return(S.meses[mk()]?.txns)||[];}
function currentQ(){return new Date().getDate()<=15?'q1':'q2';}
function totIng(){
  if(S.config.quincenas?.activo)return(+S.config.quincenas.q1||0)+(+S.config.quincenas.q2||0);
  return S.config.ingresos.reduce((s,i)=>s+(+i.m||0),0);
}
function totFijo(){return S.config.gastosFijos.reduce((s,g)=>s+(+g.m||0),0);}
function totCuota(){return S.config.deudas.reduce((s,d)=>s+(+d.c||0),0);}
function dispQ(q){
  const qc=S.config.quincenas;if(!qc?.activo)return null;
  const ing=+(qc[q]||0);
  const fijos=S.config.gastosFijos.filter(x=>(x.q||'q1')===q).reduce((s,x)=>s+(+x.m||0),0);
  const deudas=S.config.deudas.filter(x=>(x.q||'q1')===q).reduce((s,x)=>s+(+x.c||0),0);
  return ing-fijos-deudas;
}
function dispReal(){return totIng()+totIngTx()-totFijo()-totCuota();}
function totPre(){return Object.values(S.config.presup).reduce((s,v)=>s+(+v||0),0);}
function porAsig(){return dispReal()-totPre();}
function draftDispReal(){const q=cfgDraft?.quincenas;const ing=q?.activo?(+(q.q1)||0)+(+(q.q2)||0):(cfgDraft?.ingresos||[]).reduce((s,x)=>s+(+x.m||0),0);const fij=(cfgDraft?.gastosFijos||[]).reduce((s,x)=>s+(+x.m||0),0);const deu=(cfgDraft?.deudas||[]).reduce((s,x)=>s+(+x.c||0),0);return ing+totIngTx()-fij-deu;}
function draftTotPre(){return Object.values(cfgDraft?.presup||{}).reduce((s,v)=>s+(+v||0),0);}
function updatePreBar(){
  const el=document.getElementById('pre-libre-bar');if(!el)return;
  const dr=draftDispReal(),asig=draftTotPre(),libre=dr-asig;
  const pct=dr>0?Math.min(100,Math.max(0,asig/dr*100)):asig>0?100:0;
  const col=libre<0?'var(--red)':libre<dr*0.02?'var(--orange)':'var(--green)';
  const msg=libre<0?`⚠️ Te pasaste ${fmt(-libre)}`:(libre<dr*0.02?'✅ Presupuesto al límite':`${fmt(libre)} libre`);
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px">
      <div style="font-size:12px;color:var(--text2)">Disponible: <strong style="color:var(--text);font-variant-numeric:tabular-nums">${fmt(dr)}</strong></div>
      <div style="font-size:13px;font-weight:700;color:${col};font-variant-numeric:tabular-nums">${msg}</div>
    </div>
    <div style="height:7px;border-radius:4px;background:var(--prog-track);overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${col};border-radius:4px;transition:width .15s,background .15s"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:5px">
      <div style="font-size:11px;color:var(--text2)">Asignado: <span style="font-variant-numeric:tabular-nums">${fmt(asig)}</span></div>
      <div style="font-size:11px;color:var(--text2)">${Math.round(pct)}% del disponible</div>
    </div>`;
}
function gastoCat(k){return txns().filter(t=>t.tp==='Gasto'&&t.cat===k).reduce((s,t)=>s+t.mo,0);}
function totGas(){return txns().filter(t=>t.tp==='Gasto').reduce((s,t)=>s+t.mo,0);}
function totIngTx(){return txns().filter(t=>t.tp==='Ingreso').reduce((s,t)=>s+t.mo,0);}
function cuotaDia(){const d=new Date(),dias=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return dispReal()/dias;}
function ritmo(){const d=new Date(),dias=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate();if(dias<=0)return 0;return Math.max(0,dispReal()-totGas())/dias;}

function pn(v){
  const s=String(v).trim();
  if(!s)return 0;
  // Con coma: coma=decimal, puntos=miles  ej: "28,5"  "1.500.000,50"
  if(s.includes(','))return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  // Sin coma: si hay 1 punto con ≤2 dígitos después, es decimal  ej: "28.5"
  const pts=s.split('.');
  if(pts.length===2&&pts[1].length<=2)return parseFloat(s)||0;
  // Varios puntos o 3 dígitos tras el punto = separadores de miles  ej: "15.000.000"
  return parseFloat(s.replace(/\./g,''))||0;
}
function fmt(n){if(!n&&n!==0)return'$0';const r=Math.round(n);return'$'+Math.abs(r).toLocaleString('es-CO')+(r<0?' (negativo)':'');}
function fmtD(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});}
function mesNom(m){const[y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let activeTab='dash';
function goTab(t){
  activeTab=t;
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('on'));
  const el=document.getElementById('t-'+t);if(el)el.classList.add('on');
  render();
}

// ── WIDGET SYSTEM ──
const WIDGETS_DEF=[
  {id:'score',   ico:'💚', ttl:'Salud Financiera',  desc:'Tu estado financiero general en un número'},
  {id:'flujo',   ico:'📅', ttl:'Flujo del Mes',      desc:'Proyección día a día de tu saldo'},
  {id:'patrones',ico:'🔍', ttl:'Patrones',           desc:'Cambios detectados vs mes anterior'},
  {id:'quincenas',ico:'💜',ttl:'Quincenas',          desc:'Estado de cada quincena'},
  {id:'kpi',     ico:'📈', ttl:'KPIs del día',        desc:'Cuota del día y ritmo de gasto'},
  {id:'donut',   ico:'🍩', ttl:'Distribución gastos', desc:'Gráfica por categoría'},
  {id:'deuda',   ico:'💳', ttl:'Deudas',             desc:'Amortización y estrategia de pago'},
  {id:'regla',   ico:'⚖️', ttl:'Regla 50/30/20',     desc:'Distribución ideal de tu ingreso'},
  {id:'cuentas', ico:'🏦', ttl:'Cuentas',            desc:'Saldo total de tus cuentas'},
  {id:'tarjetas',ico:'💳', ttl:'Tarjetas de Crédito',desc:'Cupo disponible y deuda'},
  {id:'metas',   ico:'🎯', ttl:'Metas',              desc:'Progreso hacia tus objetivos'},
  {id:'pagos',   ico:'☑️', ttl:'Pagos del Mes',      desc:'Checklist de pagos mensuales obligatorios'},
];
function wVisible(id){const ws=S.config.widgets||{};return ws[id]!==false;}
function toggleWidget(id){if(!S.config.widgets)S.config.widgets={};S.config.widgets[id]=!wVisible(id);save();renderWidgetsList();render();}
function openWidgets(){renderWidgetsList();openModal('m-widgets');}
function widgetsOrdenados(){
  const order=S.config.widgetsOrder||[];
  if(!order.length)return WIDGETS_DEF.map(w=>w.id);
  const extras=WIDGETS_DEF.map(w=>w.id).filter(id=>!order.includes(id));
  return [...order,...extras];
}
function moverWidget(id,dir){
  const orden=[...widgetsOrdenados()];
  const i=orden.indexOf(id);
  const j=i+dir;
  if(j<0||j>=orden.length)return;
  [orden[i],orden[j]]=[orden[j],orden[i]];
  if(!S.config)S.config={};
  S.config.widgetsOrder=orden;
  save();
  renderWidgetsList();
  render();
}

// ── PAGOS DEL MES ──
function curQ(){return new Date().getDate()<=15?'q1':'q2';}
function pagosMes(){
  const items=[];
  const qOn=S.config.quincenas?.activo;
  const q=curQ();
  (S.config.gastosFijos||[]).forEach((g,i)=>{
    const monto=+g.m||0;if(!monto)return;
    if(qOn&&(g.q||'q1')!==q)return;
    const pagado=txns().some(t=>t.tp==='Gasto'&&(t.pagoMesId===`fijo-${i}`||(t.desc===g.n&&t.mo===monto&&t.cat==='fijo')));
    items.push({id:`fijo-${i}`,tipo:'fijo',nombre:g.n,monto,pagado,ico:'📋'});
  });
  (S.config.deudas||[]).forEach((d,i)=>{
    const monto=+d.c||0;if(!monto)return;
    if(qOn&&(d.q||'q1')!==q)return;
    const pagado=txns().some(t=>t.tp==='Gasto'&&(t.pagoMesId===`deuda-${i}`||(t.desc===`Cuota ${d.n}`&&t.mo===monto)));
    items.push({id:`deuda-${i}`,tipo:'deuda',nombre:d.n,monto,pagado,ico:'💳',deudaIdx:i});
  });
  (S.cuentas||[]).filter(c=>c.tipo==='tarjeta'&&+c.saldo>0).forEach((c)=>{
    const pagado=txns().some(t=>t.tp==='Gasto'&&t.pagoMesId===`tc-${c.id}`);
    items.push({id:`tc-${c.id}`,tipo:'tarjeta',nombre:c.n,monto:+c.saldo||0,pagado,ico:'💳 TC',tcId:c.id});
  });
  return items;
}
function rPagosMes(){
  const items=pagosMes();

  const pagados=items.filter(x=>x.pagado).length;
  const total=items.length;

  const qOn=S.config.quincenas?.activo;
  const qLabel=qOn?(curQ()==='q1'?' <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(10,132,255,.15);color:var(--blue)">1ª Q</span>':' <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(191,90,242,.15);color:var(--purple)">2ª Q</span>'):'';
  return`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="card-ttl" style="margin:0">☑️ Pagos del Mes${qLabel}</div>
      <div style="font-size:13px;font-weight:700;color:${pagados===total?'var(--green)':'var(--orange)'}">${pagados}/${total}</div>

      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--sep)">

          <div style="min-width:0">
            <div style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(item.nombre)}</div>

          :`<button onclick="event.stopPropagation();abrirPagoItem('${item.id}')" style="padding:6px 14px;border-radius:16px;border:1px solid rgba(10,132,255,.3);background:rgba(10,132,255,.1);color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0">Pagar</button>`
        }
      </div>`).join('')}
    ${pagados===total&&total>0?`<div style="text-align:center;padding:10px 0;font-size:13px;color:var(--green);font-weight:600">🎉 ¡Todos los pagos al día!</div>`:''}
  </div>`;
}

  const items=pagosMes();
  const item=items.find(x=>x.id===id);

}

function confirmarPagoFijo(item){

  const dt=new Date().toISOString().slice(0,10);
  const cuentaId=cuentaRaw==='efectivo'?'':cuentaRaw;
  S.meses[cur].txns.push({id:Date.now()+Math.random().toString(36).slice(2,5),desc:item.nombre,mo,dt,tp:'Gasto',cat:'fijo',destino:'',cuentaId,cuotas:1,pagoMesId:item.id});

  else if(cuentaRaw==='efectivo'){S.config.efectivoBal=Math.max(0,(S.config.efectivoBal||0)-mo);}

}

    switch(activeTab){

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function rDonut(){
  const gastos=txns().filter(t=>t.tp==='Gasto');if(!gastos.length)return'';
  const data=CATS().map(c=>({...c,mo:gastos.filter(t=>t.cat===c.k).reduce((s,t)=>s+t.mo,0)})).filter(d=>d.mo>0);
  if(!data.length)return'';
  const total=data.reduce((s,d)=>s+d.mo,0);
  const sz=108,r=37,cx=sz/2,cy=sz/2,circ=2*Math.PI*r;
  const track=cssVar('--donut-track'),dtxt=cssVar('--donut-text'),dsub=cssVar('--donut-sub');
  let off=0;
  const segs=data.map(d=>{const dash=(d.mo/total)*circ,seg={...d,dash,off};off+=dash;return seg;});
  const paths=segs.map(s=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.col}" stroke-width="18" stroke-dasharray="${s.dash} ${circ-s.dash}" stroke-dashoffset="${-s.off}" style="transform-origin:${cx}px ${cy}px;transform:rotate(-90deg)"/>`).join('');
  const svg=`<svg style="flex-shrink:0" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="18"/>${paths}<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="${dtxt}" font-size="10" font-weight="800" font-family="-apple-system">${fmt(total)}</text><text x="${cx}" y="${cy+10}" text-anchor="middle" fill="${dsub}" font-size="8" font-family="-apple-system">gastado</text></svg>`;
  const legend=`<div style="flex:1;min-width:0">${data.slice(0,5).map(d=>`<div class="legend-item" onclick="openCatDetail('${d.k}')" style="cursor:pointer;border-radius:8px;transition:background .15s" onmouseenter="this.style.background='var(--chip-bg)'" onmouseleave="this.style.background=''"><div class="legend-dot" style="background:${d.col}"></div><div class="legend-name">${d.l.split('-')[0].split('/')[0].trim()}</div><div class="legend-pct">${(d.mo/total*100).toFixed(0)}%</div></div>`).join('')}</div>`;
  return svg+legend;
}

  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const mx=Math.max(...data.flatMap(d=>[d.ing,d.gas]),1);
  const pad={t:20,b:30,l:10,r:10},ch=H-pad.t-pad.b;
  const bw=(W-pad.l-pad.r)/(data.length*3),gap=bw*0.4;
  const cGrid=cssVar('--canvas-grid'),cTxt=cssVar('--canvas-text'),cLgd=cssVar('--canvas-legend');
  ctx.strokeStyle=cGrid;ctx.lineWidth=1;
  [0,1,2,3].forEach(i=>{const y=pad.t+(ch/3)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();});
  data.forEach((d,i)=>{
    const x=pad.l+i*(bw*2+gap+bw*0.5);const ih=(d.ing/mx)*ch,gh=(d.gas/mx)*ch;
    ctx.fillStyle='rgba(48,209,88,.75)';rRect(ctx,x,pad.t+ch-ih,bw,ih,3);ctx.fill();
    ctx.fillStyle='rgba(255,69,58,.75)';rRect(ctx,x+bw+2,pad.t+ch-gh,bw,gh,3);ctx.fill();
    ctx.fillStyle=cTxt;ctx.font='9px -apple-system';ctx.textAlign='center';ctx.fillText(d.lbl,x+bw,H-8);
  });
  const lx=W-96;
  ctx.fillStyle='rgba(48,209,88,.9)';ctx.fillRect(lx,5,8,8);ctx.fillStyle=cLgd;ctx.font='9px -apple-system';ctx.textAlign='left';ctx.fillText('Ingresos',lx+11,13);
  ctx.fillStyle='rgba(255,69,58,.9)';ctx.fillRect(lx+50,5,8,8);ctx.fillStyle=cLgd;ctx.fillText('Gastos',lx+61,13);
}

function rRect(ctx,x,y,w,h,r){
  if(h<=0)return;if(h<r*2)r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

  txEditId=editId||null;txType='Gasto';selCat='transporte';

function saveTx(){
  const desc=document.getElementById('tx-desc').value.trim();
  const mo=pn(document.getElementById('tx-monto').value);
  const dt=document.getElementById('tx-fecha').value;
  if(!desc){alert('Ingresa una descripción');return;}
  if(!mo||mo<=0){alert('Ingresa un monto válido');return;}
  if(!dt){alert('Selecciona una fecha');return;}
  const destino=txType==='Ingreso'?(document.getElementById('tx-destino')?.value||''):'';
  const cuentaRaw=document.getElementById('tx-cuenta')?.value||'';
  if(!cuentaRaw){showToast('Selecciona una cuenta','warn');return;}
  const cuentaId=cuentaRaw==='efectivo'?'':cuentaRaw;
  const cuotas=+(document.getElementById('tx-cuotas')?.value||1);
  const cur=mk();if(!S.meses[cur])S.meses[cur]={txns:[]};
  if(txEditId){
    const idx=S.meses[cur].txns.findIndex(t=>t.id===txEditId);
    if(idx>=0){
      const oldTx=S.meses[cur].txns[idx];
      if(oldTx.cuentaId){const oi=(S.cuentas||[]).findIndex(c=>c.id===oldTx.cuentaId);if(oi>=0){const oc=S.cuentas[oi];const ogmf=oc.gmf?Math.round(oldTx.mo*0.004):0;const otd=oldTx.tp==='Gasto'?oldTx.mo+ogmf:-oldTx.mo;S.cuentas[oi].saldo=Math.round(S.cuentas[oi].saldo+otd);}}
      if(!oldTx.cuentaId&&oldTx.cuentaId!==undefined&&S.cuentas.findIndex(c=>c.id===oldTx.cuentaId)<0){const odelta=oldTx.tp==='Gasto'?oldTx.mo:-oldTx.mo;S.config.efectivoBal=Math.max(0,(S.config.efectivoBal||0)+odelta);}
      S.meses[cur].txns[idx]={...oldTx,desc,mo,dt,tp:txType,cat:txType==='Gasto'?selCat:'ingreso',destino,cuentaId,cuotas};
    }
  }
  else{S.meses[cur].txns.push({id:Date.now()+Math.random().toString(36).slice(2,5),desc,mo,dt,tp:txType,cat:txType==='Gasto'?selCat:'ingreso',destino,cuentaId,cuotas});}
  if(cuentaId){const cIdx=(S.cuentas||[]).findIndex(c=>c.id===cuentaId);if(cIdx>=0){const cuenta=S.cuentas[cIdx];if(cuenta.tipo==='tarjeta'){if(txType==='Gasto'){S.cuentas[cIdx].saldo=Math.round((+S.cuentas[cIdx].saldo||0)+mo);const cupoDisp=Math.max(0,(+cuenta.cupo||0)-S.cuentas[cIdx].saldo);const pagoMes=cuotas>1?Math.round(mo/cuotas):mo;showToast(cuotas>1?`💳 ${cuotas} cuotas · ${fmt(pagoMes)}/mes · Cupo disponible: ${fmt(cupoDisp)}`:`💳 Contado · Cupo disponible: ${fmt(cupoDisp)}`,'info');}else{S.cuentas[cIdx].saldo=Math.round(Math.max(0,(+S.cuentas[cIdx].saldo||0)-mo));}}else{const gmfMonto=cuenta.gmf?Math.round(mo*0.004):0;const totalDesc=txType==='Gasto'?mo+gmfMonto:-mo;S.cuentas[cIdx].saldo=Math.round(S.cuentas[cIdx].saldo-totalDesc);if(gmfMonto>0)showToast(`4×1000: ${fmt(gmfMonto)} descontado de ${cuenta.n}`,'warn');}}}
  else if(cuentaRaw==='efectivo'){const efDelta=txType==='Gasto'?-mo:mo;S.config.efectivoBal=Math.max(0,(S.config.efectivoBal||0)+efDelta);}
  save();
  if(txType==='Gasto')checkBudgetAlerts();
  closeModal('m-tx');render();
}

function delTx(id){
  if(!confirm('¿Eliminar esta transacción?'))return;
  const cur=mk();if(S.meses[cur])S.meses[cur].txns=S.meses[cur].txns.filter(t=>t.id!==id);
  save();render();
}

function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed.config||!parsed.meses)throw new Error('Formato inválido');
      if(confirm(`¿Restaurar datos del backup? Esto reemplazará los datos actuales.\n\nBackup contiene ${Object.keys(parsed.archivos||{}).length} meses archivados.`)){
        S={...defState(),...parsed};S.config={...defState().config,...parsed.config};
        save();closeModal('m-cfg');render();alert('✅ Datos restaurados correctamente');
      }
    }catch(err){alert('Error al importar: el archivo no parece ser un backup válido.');}
    input.value='';
  };
  reader.readAsText(file);
}

// ─── DEUDA TRACKER / AMORTIZACIÓN ────────────────────────────────────────────
function calcAmort(saldo,tasa,cuota){
  const tm=tasa/100/12;const rows=[];let s=+saldo;let mes=0;
  while(s>0.5&&mes<600){
    mes++;const int=tm>0?s*tm:0;const cap=Math.min(cuota-int,s);
    if(cap<=0.01)break;
    s=Math.max(0,s-cap);
    rows.push({mes,int:Math.round(int),cap:Math.round(cap),cuota:Math.round(int+cap),saldo:Math.round(s)});
  }
  return rows;
}
function rDeudaCard(){
  const deudas=S.config.deudas||[];
  const withSaldo=deudas.filter(d=>+d.saldo>0);if(!withSaldo.length)return'';
  return`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="card-ttl" style="margin:0">💳 Tracker de Deudas</div>
      <div style="font-size:11px;color:var(--text2)">${withSaldo.length} activa${withSaldo.length!==1?'s':''}</div>
    </div>
    ${deudas.map((d,i)=>{
      const s=+d.saldo||0;if(!s)return`<div style="padding:8px 0;border-bottom:1px solid var(--sep)"><div style="font-size:13px;color:var(--text2)">${esc(d.n)}</div></div>`;
      const tasa=+d.tasa||0,c=+d.c||0;
      const tm=tasa/100/12;const int=tm>0?Math.round(s*tm):0;const cap=Math.max(0,Math.round(c-int));
      const rows=c>0?calcAmort(s,tasa,c):[];
      return`<div style="padding:10px 0;border-bottom:1px solid var(--sep)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${rows.length?'8':'0'}px">
          <div><div style="font-size:14px;font-weight:600">${esc(d.n)}</div><div style="font-size:11px;color:var(--text2);margin-top:2px;font-variant-numeric:tabular-nums">Saldo: ${fmt(s)}${tasa?` · ${tasa}% EA`:''}</div></div>
          ${c>0?`<button onclick="openAmort(${i})" style="padding:6px 12px;border-radius:10px;border:1px solid rgba(10,132,255,.3);background:rgba(10,132,255,.12);color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0">Ver tabla →</button>`:''}
        </div>
        ${rows.length?`<div style="display:flex;gap:14px"><div><div style="font-size:10px;color:var(--text2)">Interés / cuota</div><div style="font-size:13px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums">${fmt(int)}</div></div><div><div style="font-size:10px;color:var(--text2)">Capital / cuota</div><div style="font-size:13px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">${fmt(cap)}</div></div><div><div style="font-size:10px;color:var(--text2)">Meses restantes</div><div style="font-size:13px;font-weight:700;color:var(--red)">${rows.length}</div></div></div>`:''}
        ${c>0?`<button onclick="event.stopPropagation();abrirPagoCuota(${i})" style="margin-top:8px;width:100%;padding:8px;border-radius:10px;border:1px solid rgba(10,132,255,.3);background:rgba(10,132,255,.1);color:var(--blue);font-size:13px;font-weight:600;cursor:pointer">💸 Registrar pago del mes</button>`:''}
      </div>`;
    }).join('')}
  ${rEstrategiaDeudas()}
  </div>`;
}

function confirmarPagoTarjeta(){
  const cuentaRaw=document.getElementById('pago-cuota-cuenta')?.value||'';
  if(!cuentaRaw){showToast('Selecciona una cuenta origen','warn');return;}
  const tcId=pagoCuotaIdx;
  const tc=(S.cuentas||[]).find(c=>c.id===tcId);if(!tc)return;
  const montoInput=pn(document.getElementById('pago-tc-monto')?.value||'0');
  const mo=montoInput||+tc.saldo||0;
  if(!mo||mo<=0){showToast('Ingresa el monto a pagar','warn');return;}
  const cur=mk();if(!S.meses[cur])S.meses[cur]={txns:[]};
  const dt=new Date().toISOString().slice(0,10);
  const cuentaId=cuentaRaw==='efectivo'?'':cuentaRaw;
  S.meses[cur].txns.push({id:Date.now()+Math.random().toString(36).slice(2,5),desc:`Pago ${tc.n}`,mo,dt,tp:'Gasto',cat:'tarjeta',destino:'',cuentaId,cuotas:1,pagoMesId:_pagandoItemId||undefined});
  _pagandoItemId=null;
  if(cuentaId){const cIdx=(S.cuentas||[]).findIndex(c=>c.id===cuentaId);if(cIdx>=0){const cuenta=S.cuentas[cIdx];const gmf=cuenta.gmf?Math.round(mo*0.004):0;S.cuentas[cIdx].saldo=Math.round(S.cuentas[cIdx].saldo-(mo+gmf));}}
  else if(cuentaRaw==='efectivo'){S.config.efectivoBal=Math.max(0,(S.config.efectivoBal||0)-mo);}
  const tcIdx=(S.cuentas||[]).findIndex(c=>c.id===tcId);
  if(tcIdx>=0)S.cuentas[tcIdx].saldo=Math.round(Math.max(0,(+S.cuentas[tcIdx].saldo||0)-mo));
  save();closeModal('m-pago-cuota');render();
  showToast(`✅ Pago de ${fmt(mo)} a ${tc.n}`,'ok');
}

function registrarAbono(){
  const d=(S.config.deudas||[])[amortIdx];if(!d)return;
  const val=pn(document.getElementById('abono-xtra-val').value);
  if(!val||val<=0){showToast('Ingresa un monto válido','warn');return;}
  if(val>d.saldo){showToast('El abono supera el saldo actual','warn');return;}
  const saldoAntes=+d.saldo;
  const tasa=+d.tasa||0,cuota=+d.c||0;
  const rowsAntes=cuota>0?calcAmort(saldoAntes,tasa,cuota):[];
  if(!d.abonos)d.abonos=[];
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const fecha=new Date().toISOString().slice(0,10);
  S.config.deudas[amortIdx].saldo=Math.round(Math.max(0,saldoAntes-val));
  d.abonos.push({id,fecha,monto:Math.round(val),saldoAntes:Math.round(saldoAntes),saldoDespues:S.config.deudas[amortIdx].saldo});
  save();
  const saldoDespues=S.config.deudas[amortIdx].saldo;
  const rowsDespues=cuota>0?calcAmort(saldoDespues,tasa,cuota):[];
  const mesAhorrados=rowsAntes.length-rowsDespues.length;
  const intAhorrado=rowsAntes.reduce((s,r)=>s+r.int,0)-rowsDespues.reduce((s,r)=>s+r.int,0);
  const msg=mesAhorrados>0
    ?`💸 Abono de ${fmt(val)} aplicado · ahorras ${mesAhorrados} mes${mesAhorrados!==1?'es':''} y ${fmt(intAhorrado)} en intereses`
    :`💸 Abono de ${fmt(val)} aplicado · nuevo saldo: ${fmt(saldoDespues)}`;
  showToast(msg,'ok');
  render();
  renderAmortBody();
}

  rec.filter(r=>r.activo!==false).forEach(r=>{

// ─── SCORE DE SALUD FINANCIERA ────────────────────────────────────────────────
function calcScore(){
  const ing=totIng()+totIngTx();
  if(ing<=0)return{score:0,label:'Sin datos',color:'var(--text2)',detalles:[]};
  const detalles=[];
  const ratioDeuda=totCuota()/ing;
  const ptsDeuda=ratioDeuda<=0.2?30:ratioDeuda<=0.35?20:ratioDeuda<=0.5?10:0;
  detalles.push({l:'Carga de deudas',pts:ptsDeuda,max:30,ico:'💳'});
  const gastoMes=txns().filter(t=>t.tp==='Gasto').reduce((s,t)=>s+t.mo,0);
  const tasaAhorro=(ing-gastoMes-totFijo())/ing;
  const ptsAhorro=tasaAhorro>=0.2?25:tasaAhorro>=0.1?15:tasaAhorro>=0?8:0;
  detalles.push({l:'Tasa de ahorro',pts:ptsAhorro,max:25,ico:'💰'});
  const cats=CATS();let bajo=0,total=0;
  cats.forEach(c=>{const p=catBudgetTotal(c.k);if(p>0){total++;const g=txns().filter(t=>t.tp==='Gasto'&&t.cat===c.k).reduce((s,t)=>s+t.mo,0);if(g<=p)bajo++;}});
  const ptsPre=total>0?Math.round((bajo/total)*25):15;
  detalles.push({l:'Control presupuesto',pts:ptsPre,max:25,ico:'📊'});
  const tarjetas=(S.cuentas||[]).filter(c=>c.tipo==='tarjeta'&&+c.cupo>0);
  const ptsTC=tarjetas.length===0?20:(()=>{const avg=tarjetas.reduce((s,c)=>s+((+c.saldo||0)/(+c.cupo||1)),0)/tarjetas.length;return avg<=0.3?20:avg<=0.5?12:avg<=0.7?6:0;})();
  detalles.push({l:'Uso tarjetas',pts:ptsTC,max:20,ico:'💳'});
  const score=detalles.reduce((s,d)=>s+d.pts,0);
  const label=score>=80?'Excelente':score>=60?'Buena':score>=40?'Regular':'Crítica';
  const color=score>=80?'var(--green)':score>=60?'var(--blue)':score>=40?'var(--orange)':'var(--red)';
  return{score,label,color,detalles};
}
function rScoreCard(){

  return`<div class="card" style="text-align:center">
    <div class="card-ttl" style="text-align:left;margin-bottom:12px">Salud Financiera</div>

// ─── FLUJO DE CAJA PROYECTADO ──────────────────────────────────────────────────
function rFlujoCaja(){
  const ctas=(S.cuentas||[]).filter(c=>(c.tipo||'cuenta')==='cuenta');
  const saldoInicial=ctas.reduce((s,c)=>s+(+c.saldo||0),0);
  if(!saldoInicial&&!ctas.length)return'';
  const hoy=new Date();
  const anio=hoy.getFullYear(),mes=hoy.getMonth();
  const diasEnMes=new Date(anio,mes+1,0).getDate();
  const q=S.config.quincenas;
  const eventos=[];
  S.config.gastosFijos.forEach(g=>{
    const dia=q?.activo?((g.q||'q1')==='q1'?1:16):1;
    eventos.push({dia,monto:-(+g.m||0),desc:g.n,tipo:'fijo'});
  });
  S.config.deudas.forEach(d=>{
    const dia=q?.activo?((d.q||'q1')==='q1'?1:16):1;
    eventos.push({dia,monto:-(+d.c||0),desc:d.n,tipo:'deuda'});
  });
  if(q?.activo){
    eventos.push({dia:1,monto:+(q.q1||0),desc:'Quincena 1',tipo:'ingreso'});
    eventos.push({dia:16,monto:+(q.q2||0),desc:'Quincena 2',tipo:'ingreso'});
  } else {
    eventos.push({dia:1,monto:totIng(),desc:'Ingreso',tipo:'ingreso'});
  }
  let saldo=saldoInicial;const dias=[];
  for(let d=1;d<=diasEnMes;d++){
    const evsDia=eventos.filter(e=>e.dia===d);
    const delta=evsDia.reduce((s,e)=>s+e.monto,0);
    saldo+=delta;
    dias.push({d,saldo,evsDia,esHoy:d===hoy.getDate()});
  }
  const minSaldo=Math.min(...dias.map(d=>d.saldo));
  const maxSaldo=Math.max(...dias.map(d=>d.saldo));
  const rng=Math.max(1,maxSaldo-minSaldo);
  const H=60;
  const dMax=Math.max(1,diasEnMes-1);
  const pts=dias.map((d,i)=>{const x=(i/dMax)*280;const y=H-((d.saldo-minSaldo)/rng)*H;return`${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');
  const hoyData=dias.find(d=>d.esHoy);
  return`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="card-ttl" style="margin:0">📅 Flujo del Mes</div>
      <div style="font-size:12px;color:var(--text2)">Proyección</div>
    </div>
    <svg viewBox="0 0 280 ${H+10}" style="width:100%;overflow:visible;margin-bottom:8px">
      <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
      ${dias.filter(d=>d.esHoy).map(d=>{const x=((d.d-1)/dMax)*280;const y=H-((d.saldo-minSaldo)/rng)*H;return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--blue)"/>`;}).join('')}
      ${dias.filter(d=>d.saldo<0).map(d=>{const x=((d.d-1)/dMax)*280;return`<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H}" stroke="var(--red)" stroke-width="1" stroke-dasharray="2,2" opacity=".4"/>`;}).join('')}
    </svg>
    ${hoyData?`<div style="font-size:13px;color:var(--text2)">Hoy día ${hoyData.d} — saldo proyectado: <strong style="color:${hoyData.saldo>=0?'var(--green)':'var(--red)'};font-variant-numeric:tabular-nums">${fmt(hoyData.saldo)}</strong></div>`:''}
    ${minSaldo<0?`<div style="font-size:12px;color:var(--red);margin-top:6px">⚠️ Proyección en rojo en algún punto del mes</div>`:''}
  </div>`;
}

// ─── ANÁLISIS DE PATRONES ──────────────────────────────────────────────────────
function rPatrones(){
  const curMk=mk();
  const [y,m]=curMk.split('-').map(Number);
  const prevMk=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;
  const prevTxns=(S.meses[prevMk]?.txns||S.archivos[prevMk]?.txns||[]);
  if(!prevTxns.length)return'';
  const cats=CATS();
  const insights=[];
  cats.forEach(c=>{
    const cur=txns().filter(t=>t.tp==='Gasto'&&t.cat===c.k).reduce((s,t)=>s+t.mo,0);
    const prev=prevTxns.filter(t=>t.tp==='Gasto'&&t.cat===c.k).reduce((s,t)=>s+t.mo,0);
    if(prev>0&&cur>0){
      const pct=Math.round(((cur-prev)/prev)*100);
      if(pct>=30)insights.push({tipo:'warn',msg:`${c.ic} <strong>${c.l}</strong>: subió ${pct}% vs mes pasado`});
      else if(pct<=-30)insights.push({tipo:'ok',msg:`${c.ic} <strong>${c.l}</strong>: bajó ${Math.abs(pct)}% vs mes pasado`});
    }
  });
  const ingCur=totIngTx();
  const ingPrev=prevTxns.filter(t=>t.tp==='Ingreso').reduce((s,t)=>s+t.mo,0);
  if(ingPrev>0&&ingCur>0){
    const pct=Math.round(((ingCur-ingPrev)/ingPrev)*100);
    if(Math.abs(pct)>=20)insights.push({tipo:pct>0?'ok':'warn',msg:`💰 Ingresos: ${pct>0?'subieron':'bajaron'} ${Math.abs(pct)}% vs mes pasado`});
  }
  if(!insights.length)return'';
  return`<div class="card">
    <div class="card-ttl" style="margin-bottom:10px">🔍 Patrones detectados</div>
    ${insights.slice(0,4).map(i=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--sep)">
      <span style="font-size:16px">${i.tipo==='ok'?'✅':'⚠️'}</span>
      <span style="font-size:13px;color:var(--text)">${i.msg}</span>
    </div>`).join('')}
  </div>`;
}

// ─── ALERTAS INTELIGENTES ──────────────────────────────────────────────────────
function checkSmartAlerts(){
  const hoy=new Date().getDate();
  const q=S.config.quincenas;
  if(q?.activo){
    const enQ1=hoy>=1&&hoy<=15;const diasRestQ=enQ1?15-hoy:new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-hoy;
    const ingQ=enQ1?(+q.q1||0):(+q.q2||0);
    const gastado=txns().filter(t=>t.tp==='Gasto').reduce((s,t)=>s+t.mo,0);
    const pct=ingQ>0?gastado/ingQ:0;
    if(pct>0.85&&diasRestQ>3&&!_alerted.has('qpct')){_alerted.add('qpct');showToast(`⚠️ Llevas el ${Math.round(pct*100)}% de tu quincena y quedan ${diasRestQ} días`,'warn');}
  }
  if(dispReal()<0&&!_alerted.has('disp_neg')){_alerted.add('disp_neg');showToast('🚨 Tu disponible está negativo — revisa gastos fijos vs ingresos','warn');}
}

// ─── ESTRATEGIA DE PAGO DE DEUDAS ─────────────────────────────────────────────
function rEstrategiaDeudas(){
  const deudas=(S.config.deudas||[]).filter(d=>+d.saldo>0&&+d.c>0);
  if(deudas.length<2)return'';
  function simular(orden){
    let ds=orden.map(d=>({saldo:+d.saldo,tasa:+d.tasa||0,cuota:+d.c,n:d.n}));
    let meses=0,totalInt=0;
    while(ds.some(d=>d.saldo>0)&&meses<360){
      meses++;
      ds.forEach(d=>{
        if(d.saldo<=0)return;
        const int=d.saldo*(d.tasa/100/12);
        const cap=Math.min(d.saldo,d.cuota-int);
        totalInt+=int;d.saldo=Math.max(0,d.saldo-cap);
      });
    }
    return{meses,totalInt:Math.round(totalInt)};
  }
  const nieve=simular([...deudas].sort((a,b)=>+a.saldo-+b.saldo));
  const avalancha=simular([...deudas].sort((a,b)=>+b.tasa-+a.tasa));
  const mejor=avalancha.totalInt<=nieve.totalInt?'avalancha':'nieve';
  return`<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--sep)">
    <div style="font-size:14px;font-weight:700;margin-bottom:10px">⚡ Estrategia de pago</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div style="background:${mejor==='nieve'?'rgba(48,209,88,.1)':'var(--input-bg)'};border:1px solid ${mejor==='nieve'?'var(--green)':'var(--card-b)'};border-radius:12px;padding:10px">
        <div style="font-size:12px;font-weight:700;margin-bottom:4px">❄️ Bola de nieve</div>
        <div style="font-size:11px;color:var(--text2)">Menor saldo primero</div>
        <div style="font-size:13px;font-weight:700;margin-top:6px;color:var(--text)">${nieve.meses} meses</div>
        <div style="font-size:11px;color:var(--red)">Intereses: ${fmt(nieve.totalInt)}</div>
        ${mejor==='nieve'?'<div style="font-size:10px;color:var(--green);font-weight:700;margin-top:4px">✓ Más motivador</div>':''}
      </div>
      <div style="background:${mejor==='avalancha'?'rgba(48,209,88,.1)':'var(--input-bg)'};border:1px solid ${mejor==='avalancha'?'var(--green)':'var(--card-b)'};border-radius:12px;padding:10px">
        <div style="font-size:12px;font-weight:700;margin-bottom:4px">🌊 Avalancha</div>
        <div style="font-size:11px;color:var(--text2)">Mayor tasa primero</div>
        <div style="font-size:13px;font-weight:700;margin-top:6px;color:var(--text)">${avalancha.meses} meses</div>
        <div style="font-size:11px;color:var(--red)">Intereses: ${fmt(avalancha.totalInt)}</div>
        ${mejor==='avalancha'?'<div style="font-size:10px;color:var(--green);font-weight:700;margin-top:4px">✓ Ahorra más</div>':''}
      </div>
    </div>
    <div style="font-size:11px;color:var(--text2);margin-top:8px">💡 Ahorras ${fmt(Math.abs(nieve.totalInt-avalancha.totalInt))} en intereses con ${mejor==='avalancha'?'avalancha':'bola de nieve'}</div>
  </div>`;
}

// ─── METAS: FECHA PROYECTADA Y APORTES ────────────────────────────────────────
function metaFechaProyectada(meta){
  const faltante=Math.max(0,(+meta.meta||0)-(+meta.actual||0));
  if(!faltante)return'¡Cumplida!';
  const aporte=+meta.aporte||0;
  if(!aporte)return'Sin aporte mensual';
  const meses=Math.ceil(faltante/aporte);
  const fecha=new Date();fecha.setMonth(fecha.getMonth()+meses);
  return fecha.toLocaleDateString('es-CO',{month:'long',year:'numeric'});
}
function totAportesMetas(){return(S.metas||[]).reduce((s,m)=>s+(+m.aporte||0),0);}

// ─── FORMATO MONTO ────────────────────────────────────────────────────────────
function fmtAmtInput(el){
  const raw=el.value.replace(/[^0-9]/g,'');
  if(!raw){el.value='';return;}
  el.value=parseInt(raw,10).toLocaleString('es-CO');
}

// ─── DRILL-DOWN CATEGORÍA ─────────────────────────────────────────────────────
let catDetailKey=null;
function openCatDetail(k){
  catDetailKey=k;
  const cat=CATS().find(c=>c.k===k);
  if(cat)document.getElementById('catdetail-ttl').textContent=cat.ic+' '+cat.l;
  renderCatDetail();
  openModal('m-catdetail');
}

function renderCatDetail(){
  const el=document.getElementById('catdetail-body');if(!el)return;
  const cat=CATS().find(c=>c.k===catDetailKey);if(!cat)return;
  const txlist=txns().filter(t=>t.tp==='Gasto'&&t.cat===catDetailKey).sort((a,b)=>b.dt.localeCompare(a.dt));
  const total=txlist.reduce((s,t)=>s+t.mo,0);
  const pre=catBudgetTotal(catDetailKey);
  const pct=pre>0?Math.min(100,total/pre*100):0;
  const byDay={};txlist.forEach(t=>{byDay[t.dt]=(byDay[t.dt]||0)+t.mo;});
  const days=Object.entries(byDay).sort((a,b)=>a[0].localeCompare(b[0]));
  const maxDay=days.length?Math.max(...days.map(d=>d[1])):1;
  el.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <div style="background:${cat.col}18;border:1px solid ${cat.col}33;border-radius:12px;padding:12px;text-align:center">
        <div style="font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px">Gastado</div>
        <div style="font-size:20px;font-weight:800;color:${cat.col};font-variant-numeric:tabular-nums">${fmt(total)}</div>
      </div>
      ${pre>0?`<div style="background:var(--card);border:1px solid var(--card-b);border-radius:12px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px">Presupuesto</div><div style="font-size:20px;font-weight:800;font-variant-numeric:tabular-nums">${fmt(pre)}</div></div>`:`<div style="background:var(--card);border:1px solid var(--card-b);border-radius:12px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px">Transacciones</div><div style="font-size:20px;font-weight:800">${txlist.length}</div></div>`}
    </div>
    ${pre>0?`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:5px"><span>Uso del presupuesto</span><span style="color:${pct>=100?'var(--red)':'var(--text)'};font-weight:700">${Math.round(pct)}%</span></div><div style="height:7px;border-radius:4px;background:var(--prog-track)"><div style="height:100%;width:${pct}%;background:${pct>=100?'var(--red)':cat.col};border-radius:4px;transition:width .3s"></div></div></div>`:''}
    ${days.length>0?`<div style="background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:14px;margin-bottom:14px"><div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin-bottom:10px">Gastos por día</div><div style="display:flex;align-items:flex-end;gap:3px;height:60px">${days.map(([d,v])=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div title="${fmt(v)}" style="width:100%;background:${cat.col};border-radius:3px 3px 0 0;height:${Math.max(4,Math.round(v/maxDay*52))}px"></div><div style="font-size:9px;color:var(--text3)">${d.slice(8)}</div></div>`).join('')}</div></div>`:''}
    <div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin-bottom:8px">${txlist.length} transacción${txlist.length!==1?'es':''}</div>
    ${txlist.length===0?`<div style="text-align:center;padding:20px;color:var(--text2)">Sin gastos en esta categoría</div>`:txlist.map(t=>rTxItem(t,false)).join('')}
  `;
}
