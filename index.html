<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<title>Finanzas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='11' fill='url(%23g)'/><defs><linearGradient id='g' x1='0' y1='0' x2='40' y2='40' gradientUnits='userSpaceOnUse'><stop offset='0%25' stop-color='%230A84FF'/><stop offset='100%25' stop-color='%23BF5AF2'/></linearGradient></defs><rect x='9' y='24' width='5' height='9' rx='2.5' fill='white'/><rect x='17.5' y='18' width='5' height='15' rx='2.5' fill='white'/><rect x='26' y='12' width='5' height='21' rx='2.5' fill='white'/><circle cx='28.5' cy='10' r='2.2' fill='white'/></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ── TEMA OSCURO (default) ── */
:root{
  --green:#30D158;--red:#FF453A;--blue:#0A84FF;--orange:#FF9F0A;--purple:#BF5AF2;
  --bg:linear-gradient(140deg,#07071a 0%,#0d0920 45%,#190830 100%);
  --body-bg:#07071a;
  --text:#ffffff;--text2:rgba(255,255,255,0.55);--text3:rgba(255,255,255,0.30);
  --card:rgba(255,255,255,0.07);--card-b:rgba(255,255,255,0.12);
  --sep:rgba(255,255,255,0.08);
  --tabbar-bg:rgba(8,8,22,0.85);
  --sheet-bg:rgba(20,18,36,0.97);
  --input-bg:rgba(255,255,255,0.08);--input-b:rgba(255,255,255,0.14);
  --chip-bg:rgba(255,255,255,0.05);--chip-b:rgba(255,255,255,0.14);
  --del-bg:rgba(255,69,58,.15);
  --handle-bg:rgba(255,255,255,0.22);
  --prog-track:rgba(255,255,255,0.09);
  --icon-btn-bg:rgba(255,255,255,0.10);
  --icon-btn-fg:#ffffff;
  --arc-card-bg:rgba(255,255,255,0.04);
  --select-bg:#14121f;
  --canvas-text:rgba(255,255,255,0.40);
  --canvas-legend:rgba(255,255,255,0.60);
  --canvas-grid:rgba(255,255,255,0.07);
  --donut-track:rgba(255,255,255,0.07);
  --donut-text:#ffffff;
  --donut-sub:rgba(255,255,255,0.45);
  --tab-h:60px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}

/* ── TEMA CLARO ── */
@media(prefers-color-scheme:light){
  :root{
    --bg:linear-gradient(140deg,#eef2ff 0%,#f0eaff 50%,#e8f4ff 100%);
    --body-bg:#f2f2f7;
    --text:#1c1c1e;--text2:rgba(0,0,0,0.45);--text3:rgba(0,0,0,0.25);
    --card:rgba(255,255,255,0.72);--card-b:rgba(0,0,0,0.07);
    --sep:rgba(0,0,0,0.07);
    --tabbar-bg:rgba(242,242,247,0.88);
    --sheet-bg:rgba(248,248,252,0.98);
    --input-bg:rgba(0,0,0,0.05);--input-b:rgba(0,0,0,0.12);
    --chip-bg:rgba(0,0,0,0.04);--chip-b:rgba(0,0,0,0.12);
    --del-bg:rgba(255,69,58,.10);
    --handle-bg:rgba(0,0,0,0.15);
    --prog-track:rgba(0,0,0,0.08);
    --icon-btn-bg:rgba(0,0,0,0.07);
    --icon-btn-fg:#1c1c1e;
    --arc-card-bg:rgba(255,255,255,0.65);
    --select-bg:#ffffff;
    --canvas-text:rgba(0,0,0,0.45);
    --canvas-legend:rgba(0,0,0,0.55);
    --canvas-grid:rgba(0,0,0,0.07);
    --donut-track:rgba(0,0,0,0.07);
    --donut-text:#1c1c1e;
    --donut-sub:rgba(0,0,0,0.40);
  }
}

html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
  background:var(--bg);background-color:var(--body-bg);
  background-attachment:fixed;color:var(--text);-webkit-font-smoothing:antialiased;
}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--st)}
#content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(var(--tab-h) + var(--sb) + 22px);
  -webkit-overflow-scrolling:touch;
}
#tabbar{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--tab-h) + var(--sb));padding-bottom:var(--sb);
  display:flex;
  background:var(--tabbar-bg);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--sep);z-index:100;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;color:var(--text2);
  font-size:10px;font-weight:500;cursor:pointer;padding:0;
}
.tab-btn.on{color:var(--blue)}
.tab-btn svg{width:22px;height:22px}
#fab{
  position:fixed;right:20px;bottom:calc(var(--tab-h) + var(--sb) + 18px);
  width:54px;height:54px;border-radius:50%;
  background:var(--blue);border:none;color:#fff;
  font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 28px rgba(10,132,255,0.5);cursor:pointer;z-index:101;
  transition:transform .15s,box-shadow .15s;
}
#fab:active{transform:scale(.92);box-shadow:0 2px 14px rgba(10,132,255,0.4)}
.pg-head{padding:22px 20px 10px;display:flex;align-items:center;justify-content:space-between}
.pg-title{font-size:32px;font-weight:900;letter-spacing:-.8px}
.pg-title span{background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pg-sub{font-size:13px;color:var(--text2);margin-top:3px;font-weight:500}
.card{
  background:var(--card);border:1px solid var(--card-b);border-radius:20px;
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  margin:0 14px 12px;padding:18px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.card-ttl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text2);margin-bottom:12px}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 12px}
.kpi{
  background:var(--card);border:1px solid var(--card-b);border-radius:16px;
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.kpi-lbl{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:2px}
.tx-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep)}
.tx-item:last-child{border-bottom:none}
.tx-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:12px;color:var(--text2);margin-top:1px}
.tx-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.tx-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0;opacity:.7}
.prog-wrap{margin-bottom:14px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.prog-name{font-size:14px;font-weight:500}
.prog-amt{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.prog-bg{height:6px;background:var(--prog-track);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s ease}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--sep)}
.sum-row:last-child{border-bottom:none}
.sum-lbl{font-size:14px;color:var(--text2)}
.sum-val{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.rule-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--sep)}
.rule-row:last-child{border-bottom:none}
.rule-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rule-lbl{flex:1;font-size:14px}
.rule-tgt{font-size:12px;color:var(--text3)}
.rule-pct{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.rule-ico{font-size:16px;flex-shrink:0}
.donut-wrap{display:flex;gap:16px;align-items:center}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:12px}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-name{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-pct{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.overlay.on{opacity:1;pointer-events:all}
.sheet{
  width:100%;background:var(--sheet-bg);
  backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid var(--card-b);border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + var(--sb));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:90vh;overflow-y:auto;
}
.overlay.on .sheet{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--handle-bg);margin:0 auto 18px}
.modal-ttl{font-size:18px;font-weight:700;margin-bottom:18px;text-align:center}
.fgroup{margin-bottom:14px}
.flbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);display:block;margin-bottom:6px}
.finput{
  width:100%;background:var(--input-bg);border:1px solid var(--input-b);
  border-radius:12px;color:var(--text);font-size:16px;padding:12px 14px;outline:none;
  font-family:inherit;-webkit-appearance:none;transition:border-color .18s;
}
.finput:focus{border-color:var(--blue)}
.finput::placeholder{color:var(--text3)}
select.finput option{background:var(--select-bg)}
.type-tgl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.type-btn{
  padding:11px;border-radius:12px;border:1px solid var(--chip-b);
  background:var(--chip-bg);color:var(--text2);
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;
}
.type-btn.tg-gasto{background:rgba(255,69,58,.18);border-color:var(--red);color:var(--red)}
.type-btn.tg-ingreso{background:rgba(48,209,88,.18);border-color:var(--green);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{
  padding:7px 12px;border-radius:20px;border:1px solid var(--chip-b);
  background:var(--chip-bg);color:var(--text2);font-size:13px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip.on{background:rgba(10,132,255,.22);border-color:var(--blue);color:var(--blue)}
.btn-main{
  width:100%;padding:14px;border-radius:14px;border:none;
  background:var(--blue);color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-top:8px;transition:opacity .15s;
}
.btn-main:active{opacity:.8}
.btn-add{
  padding:9px 14px;border-radius:10px;border:1px dashed var(--handle-bg);
  background:none;color:var(--text2);font-size:13px;cursor:pointer;
  font-family:inherit;width:100%;margin-top:4px;
}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:none;
  background:var(--icon-btn-bg);color:var(--icon-btn-fg);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;
}
.cfg-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.cfg-tabs::-webkit-scrollbar{display:none}
.cfg-tab{
  padding:7px 14px;border-radius:20px;border:1px solid var(--chip-b);
  background:none;color:var(--text2);font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;font-family:inherit;
}
.cfg-tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cfg-row .finput{margin:0}
.cfg-nm{flex:1}
.cfg-amt{width:120px;flex-shrink:0}
.cfg-del{
  width:32px;height:32px;border-radius:8px;border:none;
  background:rgba(255,69,58,.15);color:var(--red);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.arc-card{
  background:var(--arc-card-bg);border:1px solid var(--sep);
  border-radius:16px;padding:14px;margin:0 14px 10px;
}
.month-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.28);
  border-radius:20px;padding:4px 10px;font-size:12px;color:var(--blue);font-weight:600;
}
.empty-st{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-ico{font-size:44px;margin-bottom:10px}
.empty-tx{font-size:15px;font-weight:500}
.empty-sub{font-size:13px;margin-top:5px;color:var(--text3)}
body.modal-open #content{overflow:hidden}
/* ── TOASTS ── */
#toast-cnt{position:fixed;top:calc(var(--st) + 14px);left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:380px}
.toast{padding:13px 18px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:toastIn .3s cubic-bezier(.32,.72,0,1);box-shadow:0 6px 24px rgba(0,0,0,.22)}
.toast-warn{background:rgba(255,159,10,.96);color:#fff}
.toast-danger{background:rgba(255,69,58,.96);color:#fff}
.toast-ok{background:rgba(48,209,88,.96);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
/* ── METAS ── */
.meta-card{background:var(--card);border:1px solid var(--card-b);border-radius:18px;margin:0 14px 12px;padding:16px;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
/* ── AMORT ── */
.amort-tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.amort-tbl th{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text2);padding:6px 8px;text-align:right;border-bottom:1px solid var(--sep)}
.amort-tbl th:first-child,.amort-tbl td:first-child{text-align:center}
.amort-tbl td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--sep)}
.amort-tbl tr:last-child td{border-bottom:none}
.amort-tbl tr.hi-row td{background:rgba(10,132,255,.08)}
/* ── PRINT ── */
@media print{
  #tabbar,#fab,#toast-cnt,.overlay,button{display:none!important}
  body{background:#fff!important;color:#000!important;overflow:auto!important}
  .card,.kpi,.arc-card,.meta-card{background:#fff!important;border:1px solid #ddd!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  #content{overflow:visible!important;padding-bottom:0!important}
  #app{height:auto!important;overflow:visible!important}
}
</style>
</head>
<body>

<div id="app">
  <div id="content"></div>
  <nav id="tabbar">
    <button class="tab-btn on" onclick="goTab('dash')" id="t-dash">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="9,22 9,12 15,12 15,22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Inicio
    </button>
    <button class="tab-btn" onclick="goTab('gastos')" id="t-gastos">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h20" stroke="currentColor" stroke-width="1.8"/></svg>
      Gastos
    </button>
    <button class="tab-btn" onclick="goTab('presup')" id="t-presup">
      <svg viewBox="0 0 24 24" fill="none"><path d="M18 20V10M12 20V4M6 20v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Presup.
    </button>
    <button class="tab-btn" onclick="goTab('metas')" id="t-metas">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      Metas
    </button>
    <button class="tab-btn" onclick="goTab('hist')" id="t-hist">
      <svg viewBox="0 0 24 24" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Historia
    </button>
    <button class="tab-btn" onclick="openCfg()" id="t-cfg">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.8"/></svg>
      Config
    </button>
  </nav>
  <button id="fab" onclick="openTx()">+</button>
</div>

<!-- TX MODAL -->
<div class="overlay" id="m-tx">
  <div class="sheet">
    <div class="handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <div class="modal-ttl" id="tx-ttl" style="margin:0">Nueva Transacción</div>
      <button onclick="closeModal('m-tx')" style="width:30px;height:30px;border-radius:50%;border:none;background:var(--chip-bg);color:var(--text2);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>
    </div>
    <div class="type-tgl">
      <button class="type-btn tg-gasto" onclick="setType('Gasto')" id="btn-g">↑ Gasto</button>
      <button class="type-btn" onclick="setType('Ingreso')" id="btn-i">↓ Ingreso</button>
    </div>
    <div class="fgroup">
      <label class="flbl">Descripción</label>
      <input class="finput" id="tx-desc" type="text" placeholder="ej. Mercado, Gasolina..." autocomplete="off">
    </div>
    <div class="fgroup">
      <label class="flbl">Monto</label>
      <input class="finput" id="tx-monto" type="number" inputmode="decimal" placeholder="0" min="0">
    </div>
    <div id="cat-sec">
      <label class="flbl">Categoría</label>
      <div class="chips" id="cat-chips"></div>
    </div>
    <div class="fgroup">
      <label class="flbl">Fecha</label>
      <input class="finput" id="tx-fecha" type="date">
    </div>
    <button class="btn-main" onclick="saveTx()">Guardar</button>
  </div>
</div>

<!-- CFG MODAL -->
<div class="overlay" id="m-cfg">
  <div class="sheet">
    <div class="handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <div class="modal-ttl" style="margin:0">Configuración</div>
      <button onclick="closeModal('m-cfg')" style="width:30px;height:30px;border-radius:50%;border:none;background:var(--chip-bg);color:var(--text2);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>
    </div>
    <div class="cfg-tabs">
      <button class="cfg-tab on" onclick="cfgTab('ing')">Ingresos</button>
      <button class="cfg-tab" onclick="cfgTab('fij')">Gastos Fijos</button>
      <button class="cfg-tab" onclick="cfgTab('deu')">Deudas</button>
      <button class="cfg-tab" onclick="cfgTab('pre')">Presupuesto</button>
      <button class="cfg-tab" onclick="cfgTab('qui')" style="border-color:rgba(191,90,242,.4)">💜 Quincenas</button>
      <button class="cfg-tab" onclick="cfgTab('cat')">✏️ Categorías</button>
      <button class="cfg-tab" onclick="cfgTab('rec')">📅 Recurrentes</button>

        <button class="btn-add" onclick="exportData()" style="margin:0">⬇ Exportar datos</button>

      <button class="btn-add" onclick="closeModal('m-cfg');setTimeout(exportPDF,200)" style="margin-top:8px;width:100%">🖨 Exportar PDF / Imprimir</button>

      <div style="font-size:11px;color:var(--text3);margin-top:8px;text-align:center">Guarda un .json para no perder tus datos si borras el historial del navegador</div>

  </div>
</div>

<script>
const SK='finanzas_v2';
const DEF_CATS=[
  {k:'transporte',       l:'Transporte/Gasolina',    ic:'🚗',col:'#FF9F0A'},
  {k:'alimentacionMkt',  l:'Alimentación-Mercado',   ic:'🛒',col:'#30D158'},
  {k:'alimentacionRst',  l:'Alimentación-Rest.',     ic:'🍽️',col:'#FF6B35'},
  {k:'tarjeta',          l:'Tarjeta Crédito',        ic:'💳',col:'#BF5AF2'},
  {k:'ahorro',           l:'Ahorro e Inversión',     ic:'💰',col:'#0A84FF'},
  {k:'entretenimiento',  l:'Entretenimiento',        ic:'🎮',col:'#FF453A'},
  {k:'ropa',             l:'Ropa',                   ic:'👗',col:'#FF2D92'},
  {k:'mascotas',         l:'Mascotas',               ic:'🐾',col:'#FF9F0A'},
  {k:'personal',         l:'Personal/Hogar',         ic:'🧴',col:'#32ADE6'},
  {k:'otro',             l:'Otro',                   ic:'📌',col:'#8E8E93'},
];
function CATS(){return S.cats&&S.cats.length?S.cats:DEF_CATS;}

function defState(){
  return{
    config:{
      ingresos:[{n:'Salario',m:0}],
      gastosFijos:[{n:'Arriendo',m:0}],
      deudas:[{n:'Crédito Libre Destino',c:0,saldo:0,tasa:0},{n:'Crédito Vehículo',c:0,saldo:0,tasa:0}],
      presup:{transporte:0,alimentacionMkt:0,alimentacionRst:0,tarjeta:0,ahorro:0,entretenimiento:0,ropa:0,mascotas:0,personal:0},
      quincenas:{activo:false,q1:0,q2:0},
      recurrentes:[]
    },
    meses:{},archivos:{},cats:[],metas:[],lastMk:mk()
  };
}

let S=defState();

function mk(d){const x=d||new Date();return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;}

function load(){
  try{const r=localStorage.getItem(SK);if(r){const p=JSON.parse(r);S={...defState(),...p};S.config={...defState().config,...p.config};S.config.presup={...defState().config.presup,...(p.config?.presup||{})};if(!('mascotas' in S.config.presup))S.config.presup.mascotas=0;if(!('personal' in S.config.presup))S.config.presup.personal=0;S.config.quincenas={...defState().config.quincenas,...(p.config?.quincenas||{})};if(!S.cats||!S.cats.length)S.cats=DEF_CATS.map(c=>({...c}));if(!S.metas)S.metas=[];if(!S.config.recurrentes)S.config.recurrentes=[];S.config.deudas=(S.config.deudas||[]).map(d=>({saldo:0,tasa:0,...d}));}}catch(e){}
}

function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}

function checkArchive(){
  const cur=mk();
  if(S.lastMk&&S.lastMk!==cur){
    const prev=S.meses[S.lastMk];
    if(prev&&prev.txns&&prev.txns.length>0){S.archivos[S.lastMk]={txns:prev.txns,snap:calcSnap(S.lastMk,prev.txns)};delete S.meses[S.lastMk];}
    S.lastMk=cur;save();
  }
  if(!S.meses[cur]){S.meses[cur]={txns:[]};save();}
}

function calcSnap(m,txns){
  const ing=txns.filter(t=>t.tp==='Ingreso').reduce((s,t)=>s+t.mo,0);
  const gas=txns.filter(t=>t.tp==='Gasto').reduce((s,t)=>s+t.mo,0);
  const byCat={};CATS().forEach(c=>{byCat[c.k]=txns.filter(t=>t.tp==='Gasto'&&t.cat===c.k).reduce((s,t)=>s+t.mo,0);});
  return{ing,gas,byCat};
}

function txns(){return(S.meses[mk()]?.txns)||[];}
function currentQ(){return new Date().getDate()<=15?'q1':'q2';}
function totIng(){
  if(S.config.quincenas?.activo)return(+S.config.quincenas.q1||0)+(+S.config.quincenas.q2||0);
  return S.config.ingresos.reduce((s,i)=>s+(+i.m||0),0);
}
function totFijo(){return S.config.gastosFijos.reduce((s,g)=>s+(+g.m||0),0);}
function totCuota(){return S.config.deudas.reduce((s,d)=>s+(+d.c||0),0);}
function dispQ(q){
  const qc=S.config.quincenas;if(!qc?.activo)return null;
  const ing=+(qc[q]||0);
  const fijos=S.config.gastosFijos.filter(x=>(x.q||'q1')===q).reduce((s,x)=>s+(+x.m||0),0);
  const deudas=S.config.deudas.filter(x=>(x.q||'q1')===q).reduce((s,x)=>s+(+x.c||0),0);
  return ing-fijos-deudas;
}
function dispReal(){return totIng()-totFijo()-totCuota();}
function totPre(){return Object.values(S.config.presup).reduce((s,v)=>s+(+v||0),0);}
function porAsig(){return dispReal()-totPre();}
function gastoCat(k){return txns().filter(t=>t.tp==='Gasto'&&t.cat===k).reduce((s,t)=>s+t.mo,0);}
function totGas(){return txns().filter(t=>t.tp==='Gasto').reduce((s,t)=>s+t.mo,0);}
function totIngTx(){return txns().filter(t=>t.tp==='Ingreso').reduce((s,t)=>s+t.mo,0);}
function cuotaDia(){const d=new Date(),dias=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return dispReal()/dias;}
function ritmo(){const d=new Date(),dias=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate();if(dias<=0)return 0;return Math.max(0,dispReal()-totGas())/dias;}

function pn(v){
  const s=String(v).trim();
  if(!s)return 0;
  // Con coma: coma=decimal, puntos=miles  ej: "28,5"  "1.500.000,50"
  if(s.includes(','))return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  // Sin coma: si hay 1 punto con ≤2 dígitos después, es decimal  ej: "28.5"
  const pts=s.split('.');
  if(pts.length===2&&pts[1].length<=2)return parseFloat(s)||0;
  // Varios puntos o 3 dígitos tras el punto = separadores de miles  ej: "15.000.000"
  return parseFloat(s.replace(/\./g,''))||0;
}
function fmt(n){if(!n&&n!==0)return'$0';const r=Math.round(n);return'$'+Math.abs(r).toLocaleString('es-CO')+(r<0?' (negativo)':'');}
function fmtD(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});}
function mesNom(m){const[y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let activeTab='dash';
function goTab(t){
  activeTab=t;
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('on'));
  const el=document.getElementById('t-'+t);if(el)el.classList.add('on');
  render();
}

function render(){
  const el=document.getElementById('content');if(!el)return;
  switch(activeTab){
    case'dash':el.innerHTML=rDash();break;
    case'gastos':el.innerHTML=rGastos();break;
    case'presup':el.innerHTML=rPresup();break;
    case'metas':el.innerHTML=rMetas();break;
    case'hist':el.innerHTML=rHist();setTimeout(drawChart,100);break;
    default:el.innerHTML=rDash();
  }
}

function rQCard(){
  const q1=dispQ('q1'),q2=dispQ('q2');if(q1===null)return'';
  const cq=currentQ();const otherQ=cq==='q1'?'q2':'q1';
  const curV=cq==='q1'?q1:q2,otherV=cq==='q1'?q2:q1;
  const curC=curV>=0?'var(--green)':'var(--red)',otherC=otherV>=0?'var(--green)':'var(--red)';
  const curLbl=cq==='q1'?'1ª Quincena':'2ª Quincena',otherLbl=cq==='q1'?'2ª Quincena':'1ª Quincena';
  const daysTxt=cq==='q1'?'días 1–15':'días 16–fin';
  return`<div class="card" style="background:linear-gradient(135deg,rgba(191,90,242,.12),rgba(10,132,255,.07))">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="card-ttl" style="margin:0">Plan Quincenas</div>
      <div style="font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(191,90,242,.18);border:1px solid rgba(191,90,242,.35);color:var(--purple);font-weight:700">${daysTxt}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="background:rgba(10,132,255,.10);border:1px solid rgba(10,132,255,.22);border-radius:14px;padding:13px">
        <div style="font-size:11px;color:var(--blue);font-weight:700;margin-bottom:4px">${curLbl} ← Actual</div>
        <div style="font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:${curC}">${fmt(curV)}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">libre este período</div>
      </div>
      <div style="background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:13px;opacity:.75">
        <div style="font-size:11px;color:var(--text2);font-weight:700;margin-bottom:4px">${otherLbl}</div>
        <div style="font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:${otherC}">${fmt(otherV)}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">libre ese período</div>
      </div>
    </div>
  </div>`;
}

function rDash(){
  const ing=totIng(),gas=totGas(),disp=dispReal();
  const tx=txns().slice().reverse().slice(0,5);
  const nec=totFijo()+totCuota()+(+S.config.presup.transporte||0)+(+S.config.presup.alimentacionMkt||0)+(+S.config.presup.tarjeta||0);
  const des=(+S.config.presup.alimentacionRst||0)+(+S.config.presup.entretenimiento||0)+(+S.config.presup.ropa||0);
  const aho=+S.config.presup.ahorro||0;
  const nPct=ing>0?nec/ing*100:0,dPct=ing>0?des/ing*100:0,aPct=ing>0?aho/ing*100:0;
  const donut=rDonut();const dc=disp>=0?'var(--green)':'var(--red)';
  return`
    <div class="pg-head"><div><div class="pg-title" style="display:flex;align-items:center;gap:10px"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;border-radius:10px"><rect width="40" height="40" rx="11" fill="url(#lg)"/><defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0A84FF"/><stop offset="100%" stop-color="#BF5AF2"/></linearGradient></defs><rect x="9" y="24" width="5" height="9" rx="2.5" fill="white" fill-opacity=".95"/><rect x="17.5" y="18" width="5" height="15" rx="2.5" fill="white" fill-opacity=".95"/><rect x="26" y="12" width="5" height="21" rx="2.5" fill="white" fill-opacity=".95"/><polyline points="11.5,22 20,16 28.5,10" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".5"/><circle cx="28.5" cy="10" r="2.2" fill="white"/></svg><span>Finanzas</span></div><div class="pg-sub">${mesNom(mk())}</div></div><button class="icon-btn" onclick="openCfg()">⚙</button></div>
    <div class="card" style="background:linear-gradient(135deg,rgba(10,132,255,.13),rgba(48,209,88,.06))">
      <div class="card-ttl">Disponible Real (mensual)</div>
      <div style="font-size:38px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:${dc}">${fmt(disp)}</div>
      <div style="display:flex;gap:20px;margin-top:10px">
        <div><div style="font-size:11px;color:var(--text2)">Ingresos</div><div style="font-size:15px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">${fmt(totIngTx()||ing)}</div></div>
        <div><div style="font-size:11px;color:var(--text2)">Gastado</div><div style="font-size:15px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums">${fmt(gas)}</div></div>
        <div><div style="font-size:11px;color:var(--text2)">Por Asignar</div><div style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums">${fmt(porAsig())}</div></div>
      </div>
    </div>
    ${rQCard()}
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-lbl">Cuota del Día</div><div class="kpi-val" style="color:var(--blue)">${fmt(cuotaDia())}</div><div class="kpi-sub">Presupuesto fijo</div></div>
      <div class="kpi"><div class="kpi-lbl">Ritmo Actual</div><div class="kpi-val" style="color:var(--orange)">${fmt(ritmo())}</div><div class="kpi-sub">Ajustado al ritmo</div></div>
    </div>
    ${donut?`<div class="card"><div class="card-ttl">Distribución de Gastos</div><div class="donut-wrap">${donut}</div></div>`:''}
    ${rDeudaCard()}
    <div class="card">
      <div class="card-ttl">Regla 50/30/20</div>
      <div class="rule-row"><div class="rule-dot" style="background:var(--blue)"></div><div class="rule-lbl">Necesidades</div><div class="rule-tgt">50%</div><div class="rule-pct" style="color:${nPct<=50?'var(--green)':'var(--red)'}">${nPct.toFixed(0)}%</div><div class="rule-ico">${nPct<=50?'✅':'⚠️'}</div></div>
      <div class="rule-row"><div class="rule-dot" style="background:var(--purple)"></div><div class="rule-lbl">Deseos</div><div class="rule-tgt">30%</div><div class="rule-pct" style="color:${dPct<=30?'var(--green)':'var(--red)'}">${dPct.toFixed(0)}%</div><div class="rule-ico">${dPct<=30?'✅':'⚠️'}</div></div>
      <div class="rule-row"><div class="rule-dot" style="background:var(--green)"></div><div class="rule-lbl">Ahorro</div><div class="rule-tgt">20%</div><div class="rule-pct" style="color:${aPct>=20?'var(--green)':'var(--red)'}">${aPct.toFixed(0)}%</div><div class="rule-ico">${aPct>=20?'✅':'⚠️'}</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-ttl" style="margin:0">Últimas Transacciones</div>
        <button style="background:none;border:none;color:var(--blue);font-size:13px;cursor:pointer" onclick="goTab('gastos')">Ver todas</button>
      </div>
      ${tx.length===0?`<div class="empty-st" style="padding:16px 0"><div class="empty-tx">Sin transacciones</div><div class="empty-sub">Toca + para agregar una</div></div>`:tx.map(t=>rTxItem(t,false)).join('')}
    </div>`;
}

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function rDonut(){
  const gastos=txns().filter(t=>t.tp==='Gasto');if(!gastos.length)return'';
  const data=CATS().map(c=>({...c,mo:gastos.filter(t=>t.cat===c.k).reduce((s,t)=>s+t.mo,0)})).filter(d=>d.mo>0);
  if(!data.length)return'';
  const total=data.reduce((s,d)=>s+d.mo,0);
  const sz=108,r=37,cx=sz/2,cy=sz/2,circ=2*Math.PI*r;
  const track=cssVar('--donut-track'),dtxt=cssVar('--donut-text'),dsub=cssVar('--donut-sub');
  let off=0;
  const segs=data.map(d=>{const dash=(d.mo/total)*circ,seg={...d,dash,off};off+=dash;return seg;});
  const paths=segs.map(s=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.col}" stroke-width="18" stroke-dasharray="${s.dash} ${circ-s.dash}" stroke-dashoffset="${-s.off}" style="transform-origin:${cx}px ${cy}px;transform:rotate(-90deg)"/>`).join('');
  const svg=`<svg style="flex-shrink:0" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="18"/>${paths}<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="${dtxt}" font-size="10" font-weight="800" font-family="-apple-system">${fmt(total)}</text><text x="${cx}" y="${cy+10}" text-anchor="middle" fill="${dsub}" font-size="8" font-family="-apple-system">gastado</text></svg>`;
  const legend=`<div style="flex:1;min-width:0">${data.slice(0,5).map(d=>`<div class="legend-item"><div class="legend-dot" style="background:${d.col}"></div><div class="legend-name">${d.l.split('-')[0].split('/')[0].trim()}</div><div class="legend-pct">${(d.mo/total*100).toFixed(0)}%</div></div>`).join('')}</div>`;
  return svg+legend;
}

function rGastos(){
  const tx=txns().slice().reverse();
  return`<div class="pg-head"><div><div class="pg-title">Transacciones</div><div class="pg-sub">${mesNom(mk())}</div></div><div class="month-badge">💰${fmt(totIngTx())} · 💸${fmt(totGas())}</div></div>

function rHist(){
  const arc=Object.entries(S.archivos).sort((a,b)=>b[0].localeCompare(a[0]));
  return`<div class="pg-head"><div class="pg-title">Historia</div><div class="pg-sub">${arc.length} ${arc.length===1?'mes':'meses'} archivado${arc.length===1?'':'s'}</div></div>

    ${arc.length===0?`<div class="empty-st" style="padding:60px 20px"><div class="empty-ico">📅</div><div class="empty-tx">Sin historial aún</div><div class="empty-sub">Al cerrar el mes los datos se archivan automáticamente</div></div>`:arc.map(([m,d])=>{const s=d.snap||calcSnap(m,d.txns||[]);const bal=s.ing-s.gas;return`<div class="arc-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:16px;font-weight:700">${mesNom(m)}</div><div style="font-size:12px;color:var(--text2)">${(d.txns||[]).length} movimientos</div></div><div style="display:flex;gap:18px;margin-bottom:8px"><div><div style="font-size:11px;color:var(--text2)">Ingresos</div><div style="font-size:15px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">${fmt(s.ing)}</div></div><div><div style="font-size:11px;color:var(--text2)">Gastos</div><div style="font-size:15px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums">${fmt(s.gas)}</div></div><div><div style="font-size:11px;color:var(--text2)">Balance</div><div style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:${bal>=0?'var(--green)':'var(--red)'}">${fmt(bal)}</div></div></div>${rMiniBar(s)}</div>`;}).join('')}`;
}

function rMiniBar(s){
  if(!s.byCat)return'';const entries=Object.entries(s.byCat).filter(([,v])=>v>0);if(!entries.length)return'';
  const tot=entries.reduce((a,[,v])=>a+v,0);
  return`<div style="display:flex;gap:2px;height:4px;border-radius:2px;overflow:hidden">${entries.map(([k,v])=>{const c=CATS().find(x=>x.k===k);return`<div style="flex:${(v/tot*100).toFixed(1)};background:${c?.col||'#888'};min-width:3px"></div>`;}).join('')}</div>`;
}

function drawChart(){
  const canvas=document.getElementById('hchart');if(!canvas)return;
  const arc=Object.entries(S.archivos).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);if(!arc.length)return;
  const data=arc.map(([m,d])=>({lbl:m.slice(5),ing:d.snap?.ing||0,gas:d.snap?.gas||0}));
  const W=canvas.offsetWidth||300,H=160,dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const mx=Math.max(...data.flatMap(d=>[d.ing,d.gas]),1);
  const pad={t:20,b:30,l:10,r:10},ch=H-pad.t-pad.b;
  const bw=(W-pad.l-pad.r)/(data.length*3),gap=bw*0.4;
  const cGrid=cssVar('--canvas-grid'),cTxt=cssVar('--canvas-text'),cLgd=cssVar('--canvas-legend');
  ctx.strokeStyle=cGrid;ctx.lineWidth=1;
  [0,1,2,3].forEach(i=>{const y=pad.t+(ch/3)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();});
  data.forEach((d,i)=>{
    const x=pad.l+i*(bw*2+gap+bw*0.5);const ih=(d.ing/mx)*ch,gh=(d.gas/mx)*ch;
    ctx.fillStyle='rgba(48,209,88,.75)';rRect(ctx,x,pad.t+ch-ih,bw,ih,3);ctx.fill();
    ctx.fillStyle='rgba(255,69,58,.75)';rRect(ctx,x+bw+2,pad.t+ch-gh,bw,gh,3);ctx.fill();
    ctx.fillStyle=cTxt;ctx.font='9px -apple-system';ctx.textAlign='center';ctx.fillText(d.lbl,x+bw,H-8);
  });
  const lx=W-96;
  ctx.fillStyle='rgba(48,209,88,.9)';ctx.fillRect(lx,5,8,8);ctx.fillStyle=cLgd;ctx.font='9px -apple-system';ctx.textAlign='left';ctx.fillText('Ingresos',lx+11,13);
  ctx.fillStyle='rgba(255,69,58,.9)';ctx.fillRect(lx+50,5,8,8);ctx.fillStyle=cLgd;ctx.fillText('Gastos',lx+61,13);
}

function rRect(ctx,x,y,w,h,r){
  if(h<=0)return;if(h<r*2)r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

let txType='Gasto',txEditId=null,selCat='transporte';

function openTx(editId){
  txEditId=editId||null;txType='Gasto';selCat='transporte';
  document.getElementById('tx-fecha').value=new Date().toISOString().split('T')[0];
  document.getElementById('tx-desc').value='';document.getElementById('tx-monto').value='';
  document.getElementById('tx-ttl').textContent=editId?'Editar Transacción':'Nueva Transacción';
  if(editId){const t=txns().find(t=>t.id===editId);if(t){txType=t.tp;selCat=t.cat||'otro';document.getElementById('tx-desc').value=t.desc||'';document.getElementById('tx-monto').value=t.mo;document.getElementById('tx-fecha').value=t.dt;}}
  updTypeBtns();renderChips();openModal('m-tx');
}

function setType(t){txType=t;updTypeBtns();renderChips();}

function updTypeBtns(){
  document.getElementById('btn-g').className='type-btn'+(txType==='Gasto'?' tg-gasto':'');
  document.getElementById('btn-i').className='type-btn'+(txType==='Ingreso'?' tg-ingreso':'');
  document.getElementById('cat-sec').style.display=txType==='Gasto'?'block':'none';
}

function renderChips(){
  const el=document.getElementById('cat-chips');if(!el)return;
  el.innerHTML=CATS().map(c=>`<div class="chip${selCat===c.k?' on':''}" onclick="pickCat('${c.k}')">${c.ic} ${c.l.split('-')[0].split('/')[0].trim()}</div>`).join('');
}

function pickCat(k){selCat=k;renderChips();}

function saveTx(){
  const desc=document.getElementById('tx-desc').value.trim();
  const mo=Number(document.getElementById('tx-monto').value);
  const dt=document.getElementById('tx-fecha').value;
  if(!desc){alert('Ingresa una descripción');return;}
  if(!mo||mo<=0){alert('Ingresa un monto válido');return;}
  if(!dt){alert('Selecciona una fecha');return;}
  const cur=mk();if(!S.meses[cur])S.meses[cur]={txns:[]};
  if(txEditId){const idx=S.meses[cur].txns.findIndex(t=>t.id===txEditId);if(idx>=0)S.meses[cur].txns[idx]={...S.meses[cur].txns[idx],desc,mo,dt,tp:txType,cat:txType==='Gasto'?selCat:'ingreso'};}
  else{S.meses[cur].txns.push({id:Date.now()+Math.random().toString(36).slice(2,5),desc,mo,dt,tp:txType,cat:txType==='Gasto'?selCat:'ingreso'});}
  save();
  if(txType==='Gasto')checkBudgetAlerts();
  closeModal('m-tx');render();
}

function delTx(id){
  if(!confirm('¿Eliminar esta transacción?'))return;
  const cur=mk();if(S.meses[cur])S.meses[cur].txns=S.meses[cur].txns.filter(t=>t.id!==id);
  save();render();
}

function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed.config||!parsed.meses)throw new Error('Formato inválido');
      if(confirm(`¿Restaurar datos del backup? Esto reemplazará los datos actuales.\n\nBackup contiene ${Object.keys(parsed.archivos||{}).length} meses archivados.`)){
        S={...defState(),...parsed};S.config={...defState().config,...parsed.config};
        save();closeModal('m-cfg');render();alert('✅ Datos restaurados correctamente');
      }
    }catch(err){alert('Error al importar: el archivo no parece ser un backup válido.');}
    input.value='';
  };
  reader.readAsText(file);
}

// ─── SISTEMA DE TOASTS ────────────────────────────────────────────────────────
const _alerted=new Set();
function showToast(msg,type='ok'){
  const c=document.getElementById('toast-cnt');if(!c)return;
  const t=document.createElement('div');
  t.className='toast toast-'+type;t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3200);
}
function checkBudgetAlerts(){
  if(!S.config.presup)return;
  CATS().forEach(c=>{
    const pre=+S.config.presup[c.k]||0;if(pre<=0)return;
    const gas=gastoCat(c.k);const pct=gas/pre;
    const k100=mk()+'_'+c.k+'_100',k80=mk()+'_'+c.k+'_80';
    if(pct>=1&&!_alerted.has(k100)){_alerted.add(k100);showToast('🚨 '+c.l+': presupuesto AGOTADO','danger');}
    else if(pct>=0.8&&pct<1&&!_alerted.has(k80)){_alerted.add(k80);showToast('⚠️ '+c.l+': 80% del presupuesto usado','warn');}
  });
}

// ─── METAS DE AHORRO ─────────────────────────────────────────────────────────
const META_COLS=['#0A84FF','#30D158','#FF9F0A','#FF453A','#BF5AF2','#FF2D92','#32ADE6','#FF6B35'];
let metaEditId=null,metaSelCol='#0A84FF';

function rMetas(){
  const metas=S.metas||[];
  const done=metas.filter(m=>(m.actual||0)>=m.meta).length;
  return`<div class="pg-head"><div><div class="pg-title">Metas de <span>Ahorro</span></div><div class="pg-sub">${metas.length} meta${metas.length!==1?'s':''} · ${done} lograda${done!==1?'s':''}</div></div><button class="icon-btn" onclick="openMeta()" title="Nueva meta" style="font-size:22px;font-weight:300">+</button></div>
    ${metas.length===0?`<div class="empty-st" style="padding:60px 20px"><div class="empty-ico">🎯</div><div class="empty-tx">Sin metas todavía</div><div class="empty-sub">Toca + para crear tu primera meta de ahorro</div></div>`:metas.map(m=>rMetaCard(m)).join('')}`;
}
function rMetaCard(m){
  const pct=m.meta>0?Math.min(100,((m.actual||0)/m.meta)*100):0;
  const falta=Math.max(0,m.meta-(m.actual||0));const done=falta<=0;
  return`<div class="meta-card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <div style="width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:${m.col||'#0A84FF'}22">${m.ic||'🎯'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.n)}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:1px;font-variant-numeric:tabular-nums">${fmt(m.actual||0)} de ${fmt(m.meta)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <div style="font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:${done?'var(--green)':m.col||'var(--blue)'}">${pct.toFixed(0)}%</div>
        <div style="display:flex;gap:5px">
          <button onclick="openAbonar('${m.id}')" style="padding:5px 10px;border-radius:8px;border:none;background:${done?'var(--green)':'var(--blue)'};color:#fff;font-size:12px;font-weight:700;cursor:pointer">${done?'✅':'Abonar'}</button>
          <button onclick="openMeta('${m.id}')" style="padding:5px 8px;border-radius:8px;border:none;background:var(--chip-bg);color:var(--text2);font-size:12px;cursor:pointer">✏️</button>
          <button onclick="delMeta('${m.id}')" style="padding:5px 8px;border-radius:8px;border:none;background:var(--del-bg);color:var(--red);font-size:12px;cursor:pointer">×</button>
        </div>
      </div>
    </div>
    <div class="prog-bg" style="height:8px"><div class="prog-fill" style="width:${pct}%;background:${done?'var(--green)':m.col||'var(--blue)'}"></div></div>
    ${done?`<div style="font-size:11px;color:var(--green);margin-top:6px;font-weight:700">¡Meta alcanzada! 🎉</div>`:`<div style="font-size:11px;color:var(--text2);margin-top:6px">Faltan ${fmt(falta)}</div>`}
  </div>`;
}
function openMeta(id){
  metaEditId=id||null;
  const m=id?(S.metas||[]).find(x=>x.id===id):null;
  document.getElementById('meta-ttl').textContent=id?'Editar Meta':'Nueva Meta';
  document.getElementById('meta-ic').value=m?m.ic:'🎯';
  document.getElementById('meta-nm').value=m?m.n:'';
  document.getElementById('meta-tgt').value=m?m.meta:'';
  metaSelCol=m?(m.col||'#0A84FF'):'#0A84FF';
  renderMetaCols();openModal('m-meta');
}
function renderMetaCols(){
  const el=document.getElementById('meta-cols');if(!el)return;
  el.innerHTML=META_COLS.map(c=>`<div onclick="metaSelCol='${c}';renderMetaCols()" style="width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${c===metaSelCol?'#fff':'transparent'};box-sizing:border-box;box-shadow:${c===metaSelCol?'0 0 0 2px '+c+',0 2px 6px rgba(0,0,0,.3)':'none'};transition:box-shadow .15s"></div>`).join('');
}
function saveMeta(){
  const ic=document.getElementById('meta-ic').value.trim()||'🎯';
  const n=document.getElementById('meta-nm').value.trim();
  const meta=+document.getElementById('meta-tgt').value;
  if(!n){alert('Ingresa un nombre');return;}
  if(!meta||meta<=0){alert('Ingresa un monto válido');return;}
  if(!S.metas)S.metas=[];
  if(metaEditId){const idx=S.metas.findIndex(x=>x.id===metaEditId);if(idx>=0)S.metas[idx]={...S.metas[idx],ic,n,meta,col:metaSelCol};}
  else{S.metas.push({id:Date.now()+Math.random().toString(36).slice(2,5),ic,n,meta,actual:0,col:metaSelCol});}
  save();closeModal('m-meta');render();
}
function delMeta(id){
  if(!confirm('¿Eliminar esta meta?'))return;
  S.metas=(S.metas||[]).filter(x=>x.id!==id);save();render();
}
let abonarMetaId=null;
function openAbonar(id){
  abonarMetaId=id;const m=(S.metas||[]).find(x=>x.id===id);if(!m)return;
  document.getElementById('abonar-ttl').textContent='Abonar a: '+m.n;
  document.getElementById('abonar-info').innerHTML=`<div style="text-align:center;padding:14px;background:${m.col||'#0A84FF'}18;border-radius:12px;margin-bottom:16px"><div style="font-size:30px">${m.ic||'🎯'}</div><div style="font-size:22px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;color:${m.col||'var(--blue)'}">${((Math.min(1,(m.actual||0)/m.meta))*100).toFixed(0)}%</div><div style="font-size:13px;color:var(--text2);margin-top:2px">${fmt(m.actual||0)} de ${fmt(m.meta)}</div></div>`;
  document.getElementById('abonar-val').value='';
  openModal('m-abonar');
}
function doAbonar(){
  const v=+document.getElementById('abonar-val').value;
  if(!v||v<=0){alert('Ingresa un monto válido');return;}
  const idx=(S.metas||[]).findIndex(x=>x.id===abonarMetaId);if(idx<0)return;
  S.metas[idx].actual=(S.metas[idx].actual||0)+v;
  const m=S.metas[idx];
  if(m.actual>=m.meta)showToast('🎉 ¡Meta "'+m.n+'" alcanzada!','ok');
  else showToast('💰 Abono registrado: '+fmt(v),'ok');
  save();closeModal('m-abonar');render();
}

// ─── DEUDA TRACKER / AMORTIZACIÓN ────────────────────────────────────────────
function calcAmort(saldo,tasa,cuota){
  const tm=tasa/100/12;const rows=[];let s=+saldo;let mes=0;
  while(s>0.5&&mes<600){
    mes++;const int=tm>0?s*tm:0;const cap=Math.min(cuota-int,s);
    if(cap<=0.01)break;
    s=Math.max(0,s-cap);
    rows.push({mes,int:Math.round(int),cap:Math.round(cap),cuota:Math.round(int+cap),saldo:Math.round(s)});
  }
  return rows;
}
function rDeudaCard(){
  const deudas=S.config.deudas||[];
  const withSaldo=deudas.filter(d=>+d.saldo>0);if(!withSaldo.length)return'';
  return`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="card-ttl" style="margin:0">💳 Tracker de Deudas</div>
      <div style="font-size:11px;color:var(--text2)">${withSaldo.length} activa${withSaldo.length!==1?'s':''}</div>
    </div>
    ${deudas.map((d,i)=>{
      const s=+d.saldo||0;if(!s)return`<div style="padding:8px 0;border-bottom:1px solid var(--sep)"><div style="font-size:13px;color:var(--text2)">${esc(d.n)}</div></div>`;
      const tasa=+d.tasa||0,c=+d.c||0;
      const tm=tasa/100/12;const int=tm>0?Math.round(s*tm):0;const cap=Math.max(0,Math.round(c-int));
      const rows=c>0?calcAmort(s,tasa,c):[];
      return`<div style="padding:10px 0;border-bottom:1px solid var(--sep)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${rows.length?'8':'0'}px">
          <div><div style="font-size:14px;font-weight:600">${esc(d.n)}</div><div style="font-size:11px;color:var(--text2);margin-top:2px;font-variant-numeric:tabular-nums">Saldo: ${fmt(s)}${tasa?` · ${tasa}% EA`:''}</div></div>
          ${c>0?`<button onclick="openAmort(${i})" style="padding:6px 12px;border-radius:10px;border:1px solid rgba(10,132,255,.3);background:rgba(10,132,255,.12);color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0">Ver tabla →</button>`:''}
        </div>
        ${rows.length?`<div style="display:flex;gap:14px"><div><div style="font-size:10px;color:var(--text2)">Interés / cuota</div><div style="font-size:13px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums">${fmt(int)}</div></div><div><div style="font-size:10px;color:var(--text2)">Capital / cuota</div><div style="font-size:13px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">${fmt(cap)}</div></div><div><div style="font-size:10px;color:var(--text2)">Meses restantes</div><div style="font-size:13px;font-weight:700;color:var(--red)">${rows.length}</div></div></div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}
let amortIdx=null,amortExtra=0;
function openAmort(i){
  amortIdx=i;amortExtra=0;
  const d=(S.config.deudas||[])[i];if(!d)return;
  document.getElementById('amort-ttl').textContent=d.n||'Amortización';
  renderAmortBody();openModal('m-amort');
}
function renderAmortBody(){
  const d=(S.config.deudas||[])[amortIdx];if(!d)return;
  const el=document.getElementById('amort-body');if(!el)return;
  const saldo=+d.saldo||0,tasa=+d.tasa||0,cuotaBase=+d.c||0;
  if(!saldo||!cuotaBase){
    el.innerHTML=`<div style="text-align:center;padding:30px;color:var(--text2)"><div style="font-size:36px;margin-bottom:10px">📊</div><div style="font-size:14px;line-height:1.6">Configura el <strong>saldo actual</strong> y la <strong>tasa EA</strong> de esta deuda en Configuración → Deudas para ver el análisis completo.</div></div>`;return;
  }
  const cuota=cuotaBase+(amortExtra||0);
  const rows=calcAmort(saldo,tasa,cuota);
  if(!rows.length){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text2)">Verifica que la cuota supere los intereses</div>`;return;}
  const totInt=rows.reduce((s,r)=>s+r.int,0);
  const totPag=rows.reduce((s,r)=>s+r.cuota,0);
  const rowsBase=amortExtra>0?calcAmort(saldo,tasa,cuotaBase):rows;
  const savedInt=amortExtra>0?rowsBase.reduce((s,r)=>s+r.int,0)-totInt:0;
  const savedMes=amortExtra>0?rowsBase.length-rows.length:0;
  el.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
      <div style="background:rgba(255,69,58,.10);border:1px solid rgba(255,69,58,.2);border-radius:12px;padding:12px;text-align:center">
        <div style="font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Meses restantes</div>
        <div style="font-size:24px;font-weight:800;color:var(--red)">${rows.length}</div>
      </div>
      <div style="background:rgba(255,159,10,.10);border:1px solid rgba(255,159,10,.2);border-radius:12px;padding:12px;text-align:center">
        <div style="font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Total intereses</div>
        <div style="font-size:14px;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums">${fmt(totInt)}</div>
      </div>
      <div style="background:rgba(10,132,255,.10);border:1px solid rgba(10,132,255,.2);border-radius:12px;padding:12px;text-align:center">
        <div style="font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Total a pagar</div>
        <div style="font-size:14px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums">${fmt(totPag)}</div>
      </div>
    </div>
    <div style="background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:14px;margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin-bottom:10px">Simulador de abono extra</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input class="finput" id="amort-extra" type="text" inputmode="decimal" placeholder="$ Abono extra por mes" value="${amortExtra||''}" style="flex:1;margin:0">
        <button onclick="amortSim()" style="padding:11px 16px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0">Simular</button>
      </div>
      ${amortExtra>0?`<div style="margin-top:10px;padding:10px 12px;background:rgba(48,209,88,.12);border:1px solid rgba(48,209,88,.25);border-radius:10px;font-size:13px;color:var(--green)">✅ Con ${fmt(amortExtra)}/mes extra: terminas <strong>${savedMes} mes${savedMes!==1?'es':''} antes</strong> y ahorras <strong>${fmt(savedInt)}</strong> en intereses</div>`:''}
    </div>
    <div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin-bottom:8px">Tabla de Amortización (cuota: ${fmt(cuota)}/mes)</div>
    <div style="overflow-x:auto;border-radius:12px;border:1px solid var(--sep)">
      <table class="amort-tbl">
        <thead><tr><th>Mes</th><th>Cuota</th><th>Interés</th><th>Capital</th><th>Saldo</th></tr></thead>
        <tbody>${rows.slice(0,60).map((r,idx)=>`<tr${idx===0?' class="hi-row"':''}><td>${r.mes}</td><td>${fmt(r.cuota)}</td><td style="color:var(--orange)">${fmt(r.int)}</td><td style="color:var(--green)">${fmt(r.cap)}</td><td>${fmt(r.saldo)}</td></tr>`).join('')}
        ${rows.length>60?`<tr><td colspan="5" style="text-align:center;color:var(--text2);font-style:italic;padding:10px">... ${rows.length-60} meses más</td></tr>`:''}</tbody>
      </table>
    </div>`;
}
function amortSim(){amortExtra=pn(document.getElementById('amort-extra').value);renderAmortBody();}

// ─── GASTOS RECURRENTES ────────────────────────────────────────────────────────
function checkRecurrentes(){
  const rec=S.config.recurrentes||[];if(!rec.length)return;
  const cur=mk();if(!S.meses[cur])S.meses[cur]={txns:[]};
  let added=0;
  rec.filter(r=>r.activo!==false).forEach(r=>{
    const already=S.meses[cur].txns.some(t=>t.recId===r.id&&t.dt.startsWith(cur));
    if(!already){
      const d=new Date(),lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const dia=Math.min(+r.dia||1,lastDay);
      const dt=cur+'-'+String(dia).padStart(2,'0');
      S.meses[cur].txns.push({id:Date.now()+Math.random().toString(36).slice(2,6),desc:r.n,mo:+r.m||0,dt,tp:'Gasto',cat:r.cat||'otro',recId:r.id,auto:true});
      added++;
    }
  });
  if(added>0){save();setTimeout(()=>showToast('📅 '+added+' gasto'+( added!==1?'s recurrentes':' recurrente')+' registrado'+(added!==1?'s':''),'ok'),800);}
}
function rCfgRec(){
  if(!cfgDraft.recurrentes)cfgDraft.recurrentes=[];
  const rec=cfgDraft.recurrentes;
  return(rec.length===0?`<div style="text-align:center;padding:20px;color:var(--text2);font-size:13px">Se registran automáticamente cada mes en la fecha indicada</div>`:
    `<div style="font-size:11px;color:var(--text2);margin-bottom:12px">Se registran automáticamente cada mes en la fecha indicada</div>`+
    rec.map((r,i)=>`<div style="background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:12px;margin-bottom:8px">
      <div class="cfg-row" style="margin-bottom:8px">
        <input class="finput cfg-nm" placeholder="Nombre del gasto" value="${esc(r.n)}" oninput="cfgDraft.recurrentes[${i}].n=this.value">
        <input class="finput cfg-amt" type="number" inputmode="decimal" placeholder="Monto" value="${r.m||''}" oninput="cfgDraft.recurrentes[${i}].m=+this.value||0">
        <button class="cfg-del" onclick="cfgDelRec(${i})">×</button>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <div style="flex:1">
          <div style="font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Categoría</div>
          <select class="finput" style="padding:8px 10px" onchange="cfgDraft.recurrentes[${i}].cat=this.value">${CATS().map(c=>`<option value="${c.k}"${r.cat===c.k?' selected':''}>${c.ic} ${c.l.split('-')[0].split('/')[0].trim()}</option>`).join('')}</select>
        </div>
        <div style="width:72px">
          <div style="font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Día</div>
          <input class="finput" type="number" min="1" max="28" placeholder="1" value="${r.dia||1}" oninput="cfgDraft.recurrentes[${i}].dia=Math.min(28,Math.max(1,+this.value||1))">
        </div>
        <div style="width:56px;text-align:center">
          <div style="font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Activo</div>
          <div onclick="cfgDraft.recurrentes[${i}].activo=!(cfgDraft.recurrentes[${i}].activo!==false);renderCfgBody()" style="width:44px;height:26px;border-radius:13px;background:${r.activo!==false?'var(--green)':'var(--chip-bg)'};border:1px solid ${r.activo!==false?'var(--green)':'var(--chip-b)'};cursor:pointer;position:relative;margin:0 auto">
            <div style="position:absolute;top:2px;${r.activo!==false?'right:2px':'left:2px'};width:22px;height:22px;border-radius:50%;background:#fff;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div>
          </div>
        </div>
      </div>
    </div>`).join(''))+
    `<button class="btn-add" onclick="cfgAddRec()">+ Agregar gasto recurrente</button>`;
}
function cfgAddRec(){if(!cfgDraft.recurrentes)cfgDraft.recurrentes=[];cfgDraft.recurrentes.push({n:'',m:0,cat:'otro',dia:1,activo:true,id:Date.now().toString(36)});renderCfgBody();}
function cfgDelRec(i){cfgDraft.recurrentes.splice(i,1);renderCfgBody();}

// ─── PDF EXPORT ───────────────────────────────────────────────────────────────
function exportPDF(){window.print();}

load();checkArchive();checkRecurrentes();render();
</script>
