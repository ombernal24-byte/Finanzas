<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Finanzas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ── TEMA OSCURO (default) ── */
:root{
  --green:#30D158;--red:#FF453A;--blue:#0A84FF;--orange:#FF9F0A;--purple:#BF5AF2;
  --bg:linear-gradient(140deg,#07071a 0%,#0d0920 45%,#190830 100%);
  --body-bg:#07071a;
  --text:#ffffff;--text2:rgba(255,255,255,0.55);--text3:rgba(255,255,255,0.30);
  --card:rgba(255,255,255,0.07);--card-b:rgba(255,255,255,0.12);
  --sep:rgba(255,255,255,0.08);
  --tabbar-bg:rgba(8,8,22,0.85);
  --sheet-bg:rgba(20,18,36,0.97);
  --input-bg:rgba(255,255,255,0.08);--input-b:rgba(255,255,255,0.14);
  --chip-bg:rgba(255,255,255,0.05);--chip-b:rgba(255,255,255,0.14);
  --del-bg:rgba(255,69,58,.15);
  --handle-bg:rgba(255,255,255,0.22);
  --prog-track:rgba(255,255,255,0.09);
  --icon-btn-bg:rgba(255,255,255,0.10);
  --icon-btn-fg:#ffffff;
  --arc-card-bg:rgba(255,255,255,0.04);
  --select-bg:#14121f;
  --canvas-text:rgba(255,255,255,0.40);
  --canvas-legend:rgba(255,255,255,0.60);
  --canvas-grid:rgba(255,255,255,0.07);
  --donut-track:rgba(255,255,255,0.07);
  --donut-text:#ffffff;
  --donut-sub:rgba(255,255,255,0.45);
  --tab-h:60px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}

/* ── TEMA CLARO ── */
@media(prefers-color-scheme:light){
  :root{
    --bg:linear-gradient(140deg,#eef2ff 0%,#f0eaff 50%,#e8f4ff 100%);
    --body-bg:#f2f2f7;
    --text:#1c1c1e;--text2:rgba(0,0,0,0.45);--text3:rgba(0,0,0,0.25);
    --card:rgba(255,255,255,0.72);--card-b:rgba(0,0,0,0.07);
    --sep:rgba(0,0,0,0.07);
    --tabbar-bg:rgba(242,242,247,0.88);
    --sheet-bg:rgba(248,248,252,0.98);
    --input-bg:rgba(0,0,0,0.05);--input-b:rgba(0,0,0,0.12);
    --chip-bg:rgba(0,0,0,0.04);--chip-b:rgba(0,0,0,0.12);
    --del-bg:rgba(255,69,58,.10);
    --handle-bg:rgba(0,0,0,0.15);
    --prog-track:rgba(0,0,0,0.08);
    --icon-btn-bg:rgba(0,0,0,0.07);
    --icon-btn-fg:#1c1c1e;
    --arc-card-bg:rgba(255,255,255,0.65);
    --select-bg:#ffffff;
    --canvas-text:rgba(0,0,0,0.45);
    --canvas-legend:rgba(0,0,0,0.55);
    --canvas-grid:rgba(0,0,0,0.07);
    --donut-track:rgba(0,0,0,0.07);
    --donut-text:#1c1c1e;
    --donut-sub:rgba(0,0,0,0.40);
  }
}

html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
  background:var(--bg);background-color:var(--body-bg);
  background-attachment:fixed;color:var(--text);-webkit-font-smoothing:antialiased;
}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--st)}
#content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(var(--tab-h) + var(--sb) + 22px);
  -webkit-overflow-scrolling:touch;
}
#tabbar{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--tab-h) + var(--sb));padding-bottom:var(--sb);
  display:flex;
  background:var(--tabbar-bg);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--sep);z-index:100;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;color:var(--text2);
  font-size:10px;font-weight:500;cursor:pointer;padding:0;
}
.tab-btn.on{color:var(--blue)}
.tab-btn svg{width:22px;height:22px}
#fab{
  position:fixed;right:20px;bottom:calc(var(--tab-h) + var(--sb) + 18px);
  width:54px;height:54px;border-radius:50%;
  background:var(--blue);border:none;color:#fff;
  font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 28px rgba(10,132,255,0.5);cursor:pointer;z-index:101;
  transition:transform .15s,box-shadow .15s;
}
#fab:active{transform:scale(.92);box-shadow:0 2px 14px rgba(10,132,255,0.4)}
.pg-head{padding:22px 20px 6px;display:flex;align-items:center;justify-content:space-between}
.pg-title{font-size:28px;font-weight:800;letter-spacing:-.6px}
.pg-sub{font-size:13px;color:var(--text2);margin-top:2px}
.card{
  background:var(--card);border:1px solid var(--card-b);border-radius:20px;
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  margin:0 14px 12px;padding:18px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.card-ttl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text2);margin-bottom:12px}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 12px}
.kpi{
  background:var(--card);border:1px solid var(--card-b);border-radius:16px;
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.kpi-lbl{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:2px}
.tx-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep)}
.tx-item:last-child{border-bottom:none}
.tx-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:12px;color:var(--text2);margin-top:1px}
.tx-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.tx-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0;opacity:.7}
.prog-wrap{margin-bottom:14px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.prog-name{font-size:14px;font-weight:500}
.prog-amt{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.prog-bg{height:6px;background:var(--prog-track);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s ease}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--sep)}
.sum-row:last-child{border-bottom:none}
.sum-lbl{font-size:14px;color:var(--text2)}
.sum-val{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.rule-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--sep)}
.rule-row:last-child{border-bottom:none}
.rule-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rule-lbl{flex:1;font-size:14px}
.rule-tgt{font-size:12px;color:var(--text3)}
.rule-pct{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.rule-ico{font-size:16px;flex-shrink:0}
.donut-wrap{display:flex;gap:16px;align-items:center}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:12px}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-name{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-pct{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.overlay.on{opacity:1;pointer-events:all}
.sheet{
  width:100%;background:var(--sheet-bg);
  backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid var(--card-b);border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + var(--sb));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:90vh;overflow-y:auto;
}
.overlay.on .sheet{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--handle-bg);margin:0 auto 18px}
.modal-ttl{font-size:18px;font-weight:700;margin-bottom:18px;text-align:center}
.fgroup{margin-bottom:14px}
.flbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);display:block;margin-bottom:6px}
.finput{
  width:100%;background:var(--input-bg);border:1px solid var(--input-b);
  border-radius:12px;color:var(--text);font-size:16px;padding:12px 14px;outline:none;
  font-family:inherit;-webkit-appearance:none;transition:border-color .18s;
}
.finput:focus{border-color:var(--blue)}
.finput::placeholder{color:var(--text3)}
select.finput option{background:var(--select-bg)}
.type-tgl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.type-btn{
  padding:11px;border-radius:12px;border:1px solid var(--chip-b);
  background:var(--chip-bg);color:var(--text2);
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;
}
.type-btn.tg-gasto{background:rgba(255,69,58,.18);border-color:var(--red);color:var(--red)}
.type-btn.tg-ingreso{background:rgba(48,209,88,.18);border-color:var(--green);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{
  padding:7px 12px;border-radius:20px;border:1px solid var(--chip-b);
  background:var(--chip-bg);color:var(--text2);font-size:13px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip.on{background:rgba(10,132,255,.22);border-color:var(--blue);color:var(--blue)}
.btn-main{
  width:100%;padding:14px;border-radius:14px;border:none;
  background:var(--blue);color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-top:8px;transition:opacity .15s;
}
.btn-main:active{opacity:.8}
.btn-add{
  padding:9px 14px;border-radius:10px;border:1px dashed var(--handle-bg);
  background:none;color:var(--text2);font-size:13px;cursor:pointer;
  font-family:inherit;width:100%;margin-top:4px;
}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:none;
  background:var(--icon-btn-bg);color:var(--icon-btn-fg);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;
}
.cfg-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.cfg-tabs::-webkit-scrollbar{display:none}
.cfg-tab{
  padding:7px 14px;border-radius:20px;border:1px solid var(--chip-b);
  background:none;color:var(--text2);font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;font-family:inherit;
}
.cfg-tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cfg-row .finput{margin:0}
.cfg-nm{flex:1}
.cfg-amt{width:120px;flex-shrink:0}
.cfg-del{
  width:32px;height:32px;border-radius:8px;border:none;
  background:rgba(255,69,58,.15);color:var(--red);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.arc-card{
  background:var(--arc-card-bg);border:1px solid var(--sep);
  border-radius:16px;padding:14px;margin:0 14px 10px;
}
.month-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.28);
  border-radius:20px;padding:4px 10px;font-size:12px;color:var(--blue);font-weight:600;
}
.empty-st{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-ico{font-size:44px;margin-bottom:10px}
.empty-tx{font-size:15px;font-weight:500}
.empty-sub{font-size:13px;margin-top:5px;color:var(--text3)}
body.modal-open #content{overflow:hidden}
</style>
</head>
<body>

<div id="app">
  <div id="content"></div>
  <nav id="tabbar">
    <button class="tab-btn on" onclick="goTab('dash')" id="t-dash">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="9,22 9,12 15,12 15,22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Inicio
    </button>
    <button class="tab-btn" onclick="goTab('gastos')" id="t-gastos">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h20" stroke="currentColor" stroke-width="1.8"/></svg>
      Gastos
    </button>
    <button class="tab-btn" onclick="goTab('presup')" id="t-presup">
      <svg viewBox="0 0 24 24" fill="none"><path d="M18 20V10M12 20V4M6 20v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Presupuesto
    </button>
    <button class="tab-btn" onclick="goTab('hist')" id="t-hist">
      <svg viewBox="0 0 24 24" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Historia
    </button>
    <button class="tab-btn" onclick="openCfg()" id="t-cfg">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.8"/></svg>
      Config
    </button>
  </nav>
  <button id="fab" onclick="openTx()">+</button>
</div>

<!-- TX MODAL -->
<div class="overlay" id="m-tx">
  <div class="sheet">
    <div class="handle"></div>
    <div class="modal-ttl" id="tx-ttl">Nueva Transacción</div>
    <div class="type-tgl">
      <button class="type-btn tg-gasto" onclick="setType('Gasto')" id="btn-g">↑ Gasto</button>
      <button class="type-btn" onclick="setType('Ingreso')" id="btn-i">↓ Ingreso</button>
    </div>
    <div class="fgroup">
      <label class="flbl">Descripción</label>
      <input class="finput" id="tx-desc" type="text" placeholder="ej. Mercado, Gasolina..." autocomplete="off">
    </div>
    <div class="fgroup">
      <label class="flbl">Monto</label>
      <input class="finput" id="tx-monto" type="number" inputmode="decimal" placeholder="0" min="0">
    </div>
    <div id="cat-sec">
      <label class="flbl">Categoría</label>
      <div class="chips" id="cat-chips"></div>
    </div>
    <div class="fgroup">
      <label class="flbl">Fecha</label>
      <input class="finput" id="tx-fecha" type="date">
    </div>
    <button class="btn-main" onclick="saveTx()">Guardar</button>
  </div>
</div>

<!-- CFG MODAL -->
<div class="overlay" id="m-cfg">
  <div class="sheet">
    <div class="handle"></div>
    <div class="modal-ttl">Configuración</div>
    <div class="cfg-tabs">
      <button class="cfg-tab on" onclick="cfgTab('ing')">Ingresos</button>
      <button class="cfg-tab" onclick="cfgTab('fij')">Gastos Fijos</button>
      <button class="cfg-tab" onclick="cfgTab('deu')">Deudas</button>
      <button class="cfg-tab" onclick="cfgTab('pre')">Presupuesto</button>
      <button class="cfg-tab" onclick="cfgTab('qui')" style="border-color:rgba(191,90,242,.4)">💜 Quincenas</button>
    </div>
    <div id="cfg-body"></div>
    <button class="btn-main" onclick="saveCfg()" style="margin-top:16px">Guardar</button>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--sep)">
      <div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin-bottom:10px">Copia de Seguridad</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn-add" onclick="exportData()" style="margin:0">⬇ Exportar datos</button>
        <button class="btn-add" onclick="document.getElementById('import-file').click()" style="margin:0">⬆ Importar datos</button>
      </div>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
      <div style="font-size:11px;color:var(--text3);margin-top:8px;text-align:center">Guarda un .json para no perder tus datos si borras el historial del navegador</div>
    </div>
  </div>
</div>

<script>
const SK='finanzas_v2';
const CATS=[
  {k:'transporte',       l:'Transporte/Gasolina',    ic:'🚗',col:'#FF9F0A'},
  {k:'alimentacionMkt',  l:'Alimentación-Mercado',   ic:'🛒',col:'#30D158'},
  {k:'alimentacionRst',  l:'Alimentación-Rest.',     ic:'🍽️',col:'#FF6B35'},
  {k:'tarjeta',          l:'Tarjeta Crédito',        ic:'💳',col:'#BF5AF2'},
  {k:'ahorro',           l:'Ahorro e Inversión',     ic:'💰',col:'#0A84FF'},
  {k:'entretenimiento',  l:'Entretenimiento',        ic:'🎮',col:'#FF453A'},
  {k:'ropa',             l:'Ropa',                   ic:'👗',col:'#FF2D92'},
  {k:'mascotas',         l:'Mascotas',               ic:'🐾',col:'#FF9F0A'},
  {k:'personal',         l:'Personal/Hogar',         ic:'🧴',col:'#32ADE6'},
  {k:'otro',             l:'Otro',                   ic:'📌',col:'#8E8E93'},
];

function defState(){
  return{
    config:{
      ingresos:[{n:'Salario',m:0}],
      gastosFijos:[{n:'Arriendo',m:0}],
      deudas:[{n:'Crédito Libre Destino',c:0},{n:'Crédito Vehículo',c:0}],
      presup:{transporte:0,alimentacionMkt:0,alimentacionRst:0,tarjeta:0,ahorro:0,entretenimiento:0,ropa:0,mascotas:0,personal:0},
      quincenas:{activo:false,q1:0,q2:0}
    },
    meses:{},archivos:{},lastMk:mk()
  };
}

let S=defState();

function mk(d){const x=d||new Date();return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;}

function load(){
  try{const r=localStorage.getItem(SK);if(r){const p=JSON.parse(r);S={...defState(),...p};S.config={...defState().config,...p.config};S.config.presup={...defState().config.presup,...(p.config?.presup||{})};if(!('mascotas' in S.config.presup))S.config.presup.mascotas=0;if(!('personal' in S.config.presup))S.config.presup.personal=0;S.config.quincenas={...defState().config.quincenas,...(p.config?.quincenas||{})};}}catch(e){}
}

function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}

function checkArchive(){
  const cur=mk();
  if(S.lastMk&&S.lastMk!==cur){
    const prev=S.meses[S.lastMk];
    if(prev&&prev.txns&&prev.txns.length>0){S.archivos[S.lastMk]={txns:prev.txns,snap:calcSnap(S.lastMk,prev.txns)};delete S.meses[S.lastMk];}
    S.lastMk=cur;save();
  }
  if(!S.meses[cur]){S.meses[cur]={txns:[]};save();}
}

function calcSnap(m,txns){
  const ing=txns.filter(t=>t.tp==='Ingreso').reduce((s,t)=>s+t.mo,0);
  const gas=txns.filter(t=>t.tp==='Gasto').reduce((s,t)=>s+t.mo,0);
  const byCat={};CATS.forEach(c=>{byCat[c.k]=txns.filter(t=>t.tp==='Gasto'&&t.cat===c.k).reduce((s,t)=>s+t.mo,0);});
  return{ing,gas,byCat};
}

function txns(){return(S.meses[mk()]?.txns)||[];}
function currentQ(){return new Date().getDate()<=15?'q1':'q2';}
function totIng(){
  if(S.config.quincenas?.activo)return(+S.config.quincenas.q1||0)+(+S.config.quincenas.q2||0);
  return S.config.ingresos.reduce((s,i)=>s+(+i.m||0),0);
}
function totFijo(){return S.config.gastosFijos.reduce((s,g)=>s+(+g.m||0),0);}
function totCuota(){return S.config.deudas.reduce((s,d)=>s+(+d.c||0),0);}
function dispQ(q){
  const qc=S.config.quincenas;if(!qc?.activo)return null;
  const ing=+(qc[q]||0);
  const fijos=S.config.gastosFijos.filter(x=>(x.q||'q1')===q).reduce((s,x)=>s+(+x.m||0),0);
  const deudas=S.config.deudas.filter(x=>(x.q||'q1')===q).reduce((s,x)=>s+(+x.c||0),0);
  return ing-fijos-deudas;
}
function dispReal(){return totIng()-totFijo()-totCuota();}
function totPre(){return Object.values(S.config.presup).reduce((s,v)=>s+(+v||0),0);}
function porAsig(){return dispReal()-totPre();}
function gastoCat(k){return txns().filter(t=>t.tp==='Gasto'&&t.cat===k).reduce((s,t)=>s+t.mo,0);}
function totGas(){return txns().filter(t=>t.tp==='Gasto').reduce((s,t)=>s+t.mo,0);}
function totIngTx(){return txns().filter(t=>t.tp==='Ingreso').reduce((s,t)=>s+t.mo,0);}
function cuotaDia(){const d=new Date(),dias=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return dispReal()/dias;}
function ritmo(){const d=new Date(),dias=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate();if(dias<=0)return 0;return Math.max(0,dispReal()-totGas())/dias;}

function fmt(n){if(!n&&n!==0)return'$0';const r=Math.round(n);return'$'+Math.abs(r).toLocaleString('es-CO')+(r<0?' (negativo)':'');}
function fmtD(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});}
function mesNom(m){const[y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let activeTab='dash';
function goTab(t){
  activeTab=t;
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('on'));
  const el=document.getElementById('t-'+t);if(el)el.classList.add('on');
  render();
}

function render(){
  const el=document.getElementById('content');if(!el)return;
  switch(activeTab){
    case'dash':el.innerHTML=rDash();break;
    case'gastos':el.innerHTML=rGastos();break;
    case'presup':el.innerHTML=rPresup();break;
    case'hist':el.innerHTML=rHist();setTimeout(drawChart,100);break;
    default:el.innerHTML=rDash();
  }
}

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function rDonut(){
  const gastos=txns().filter(t=>t.tp==='Gasto');if(!gastos.length)return'';
  const data=CATS.map(c=>({...c,mo:gastos.filter(t=>t.cat===c.k).reduce((s,t)=>s+t.mo,0)})).filter(d=>d.mo>0);
  if(!data.length)return'';
  const total=data.reduce((s,d)=>s+d.mo,0);
  const sz=108,r=37,cx=sz/2,cy=sz/2,circ=2*Math.PI*r;
  const track=cssVar('--donut-track'),dtxt=cssVar('--donut-text'),dsub=cssVar('--donut-sub');
  let off=0;
  const segs=data.map(d=>{const dash=(d.mo/total)*circ,seg={...d,dash,off};off+=dash;return seg;});
  const paths=segs.map(s=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.col}" stroke-width="18" stroke-dasharray="${s.dash} ${circ-s.dash}" stroke-dashoffset="${-s.off}" style="transform-origin:${cx}px ${cy}px;transform:rotate(-90deg)"/>`).join('');
  const svg=`<svg style="flex-shrink:0" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="18"/>${paths}<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="${dtxt}" font-size="10" font-weight="800" font-family="-apple-system">${fmt(total)}</text><text x="${cx}" y="${cy+10}" text-anchor="middle" fill="${dsub}" font-size="8" font-family="-apple-system">gastado</text></svg>`;
  const legend=`<div style="flex:1;min-width:0">${data.slice(0,5).map(d=>`<div class="legend-item"><div class="legend-dot" style="background:${d.col}"></div><div class="legend-name">${d.l.split('-')[0].split('/')[0].trim()}</div><div class="legend-pct">${(d.mo/total*100).toFixed(0)}%</div></div>`).join('')}</div>`;
  return svg+legend;
}

function rGastos(){
  const tx=txns().slice().reverse();
  return`<div class="pg-head"><div><div class="pg-title">Transacciones</div><div class="pg-sub">${mesNom(mk())}</div></div><div class="month-badge">💰${fmt(totIngTx())} · 💸${fmt(totGas())}</div></div>

}

function rTxItem(t,del){
  const cat=CATS.find(c=>c.k===t.cat);const isG=t.tp==='Gasto';
  const col=isG?(cat?.col||'var(--red)'):'var(--green)';const ico=isG?(cat?.ic||'💸'):'💵';const sign=isG?'−':'+';
  return`<div class="tx-item"><div class="tx-ico" style="background:${col}22">${ico}</div><div class="tx-info"><div class="tx-name">${esc(t.desc||'Sin descripción')}</div><div class="tx-meta">${fmtD(t.dt)} · ${isG?(cat?.l||'Otro'):'Ingreso'}</div></div><div style="display:flex;align-items:center;gap:4px"><div class="tx-amt" style="color:${col}">${sign}${fmt(t.mo)}</div>${del?`<button class="tx-del" onclick="delTx('${t.id}')" title="Eliminar">×</button>`:''}</div></div>`;
}

function rPresup(){
  const disp=dispReal(),pr=S.config.presup;
  return`<div class="pg-head"><div class="pg-title">Presupuesto</div></div>
    <div class="card" style="background:linear-gradient(135deg,rgba(10,132,255,.1),transparent)">
      <div class="sum-row"><div class="sum-lbl">Disponible Real</div><div class="sum-val" style="color:var(--green)">${fmt(disp)}</div></div>
      <div class="sum-row"><div class="sum-lbl">Total Presupuestado</div><div class="sum-val">${fmt(totPre())}</div></div>
      <div class="sum-row"><div class="sum-lbl">Por Asignar</div><div class="sum-val" style="color:${porAsig()>=0?'var(--green)':'var(--red)'}">${fmt(porAsig())}</div></div>
    </div>
    <div class="card"><div class="card-ttl">Por Categoría</div>${CATS.filter(c=>c.k!=='otro').map(c=>{const pre=+pr[c.k]||0,gas=gastoCat(c.k);const pct=pre>0?Math.min(100,gas/pre*100):0;const over=gas>pre&&pre>0;return`<div class="prog-wrap"><div class="prog-head"><div class="prog-name">${c.ic} ${c.l}</div><div class="prog-amt" style="color:${over?'var(--red)':'var(--text2)'}">${fmt(gas)} ${pre>0?`/ ${fmt(pre)}`:'/ Sin límite'}</div></div>${pre>0?`<div class="prog-bg"><div class="prog-fill" style="width:${pct}%;background:${over?'var(--red)':c.col}"></div></div>`:''}</div>`;}).join('')}</div>`;
}

function rHist(){
  const arc=Object.entries(S.archivos).sort((a,b)=>b[0].localeCompare(a[0]));
  return`<div class="pg-head"><div class="pg-title">Historia</div><div class="pg-sub">${arc.length} ${arc.length===1?'mes':'meses'} archivado${arc.length===1?'':'s'}</div></div>
    ${arc.length>0?`<div class="card"><div class="card-ttl">Tendencia (últimos 6 meses)</div><canvas id="hchart" style="width:100%;height:160px;display:block"></canvas></div>`:''}
    ${arc.length===0?`<div class="empty-st" style="padding:60px 20px"><div class="empty-ico">📅</div><div class="empty-tx">Sin historial aún</div><div class="empty-sub">Al cerrar el mes los datos se archivan automáticamente</div></div>`:arc.map(([m,d])=>{const s=d.snap||calcSnap(m,d.txns||[]);const bal=s.ing-s.gas;return`<div class="arc-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:16px;font-weight:700">${mesNom(m)}</div><div style="font-size:12px;color:var(--text2)">${(d.txns||[]).length} movimientos</div></div><div style="display:flex;gap:18px;margin-bottom:8px"><div><div style="font-size:11px;color:var(--text2)">Ingresos</div><div style="font-size:15px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">${fmt(s.ing)}</div></div><div><div style="font-size:11px;color:var(--text2)">Gastos</div><div style="font-size:15px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums">${fmt(s.gas)}</div></div><div><div style="font-size:11px;color:var(--text2)">Balance</div><div style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:${bal>=0?'var(--green)':'var(--red)'}">${fmt(bal)}</div></div></div>${rMiniBar(s)}</div>`;}).join('')}`;
}

function rMiniBar(s){
  if(!s.byCat)return'';const entries=Object.entries(s.byCat).filter(([,v])=>v>0);if(!entries.length)return'';
  const tot=entries.reduce((a,[,v])=>a+v,0);
  return`<div style="display:flex;gap:2px;height:4px;border-radius:2px;overflow:hidden">${entries.map(([k,v])=>{const c=CATS.find(x=>x.k===k);return`<div style="flex:${(v/tot*100).toFixed(1)};background:${c?.col||'#888'};min-width:3px"></div>`;}).join('')}</div>`;
}

function drawChart(){
  const canvas=document.getElementById('hchart');if(!canvas)return;
  const arc=Object.entries(S.archivos).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);if(!arc.length)return;
  const data=arc.map(([m,d])=>({lbl:m.slice(5),ing:d.snap?.ing||0,gas:d.snap?.gas||0}));
  const W=canvas.offsetWidth||300,H=160,dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const mx=Math.max(...data.flatMap(d=>[d.ing,d.gas]),1);
  const pad={t:20,b:30,l:10,r:10},ch=H-pad.t-pad.b;
  const bw=(W-pad.l-pad.r)/(data.length*3),gap=bw*0.4;
  const cGrid=cssVar('--canvas-grid'),cTxt=cssVar('--canvas-text'),cLgd=cssVar('--canvas-legend');
  ctx.strokeStyle=cGrid;ctx.lineWidth=1;
  [0,1,2,3].forEach(i=>{const y=pad.t+(ch/3)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();});
  data.forEach((d,i)=>{
    const x=pad.l+i*(bw*2+gap+bw*0.5);const ih=(d.ing/mx)*ch,gh=(d.gas/mx)*ch;
    ctx.fillStyle='rgba(48,209,88,.75)';rRect(ctx,x,pad.t+ch-ih,bw,ih,3);ctx.fill();
    ctx.fillStyle='rgba(255,69,58,.75)';rRect(ctx,x+bw+2,pad.t+ch-gh,bw,gh,3);ctx.fill();
    ctx.fillStyle=cTxt;ctx.font='9px -apple-system';ctx.textAlign='center';ctx.fillText(d.lbl,x+bw,H-8);
  });
  const lx=W-96;
  ctx.fillStyle='rgba(48,209,88,.9)';ctx.fillRect(lx,5,8,8);ctx.fillStyle=cLgd;ctx.font='9px -apple-system';ctx.textAlign='left';ctx.fillText('Ingresos',lx+11,13);
  ctx.fillStyle='rgba(255,69,58,.9)';ctx.fillRect(lx+50,5,8,8);ctx.fillStyle=cLgd;ctx.fillText('Gastos',lx+61,13);
}

function rRect(ctx,x,y,w,h,r){
  if(h<=0)return;if(h<r*2)r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

let txType='Gasto',txEditId=null,selCat='transporte';

function openTx(editId){
  txEditId=editId||null;txType='Gasto';selCat='transporte';
  document.getElementById('tx-fecha').value=new Date().toISOString().split('T')[0];
  document.getElementById('tx-desc').value='';document.getElementById('tx-monto').value='';
  document.getElementById('tx-ttl').textContent=editId?'Editar Transacción':'Nueva Transacción';
  if(editId){const t=txns().find(t=>t.id===editId);if(t){txType=t.tp;selCat=t.cat||'otro';document.getElementById('tx-desc').value=t.desc||'';document.getElementById('tx-monto').value=t.mo;document.getElementById('tx-fecha').value=t.dt;}}
  updTypeBtns();renderChips();openModal('m-tx');
}

function setType(t){txType=t;updTypeBtns();renderChips();}

function updTypeBtns(){
  document.getElementById('btn-g').className='type-btn'+(txType==='Gasto'?' tg-gasto':'');
  document.getElementById('btn-i').className='type-btn'+(txType==='Ingreso'?' tg-ingreso':'');
  document.getElementById('cat-sec').style.display=txType==='Gasto'?'block':'none';
}

function renderChips(){
  const el=document.getElementById('cat-chips');if(!el)return;
  el.innerHTML=CATS.map(c=>`<div class="chip${selCat===c.k?' on':''}" onclick="pickCat('${c.k}')">${c.ic} ${c.l.split('-')[0].split('/')[0].trim()}</div>`).join('');
}

function pickCat(k){selCat=k;renderChips();}

function saveTx(){
  const desc=document.getElementById('tx-desc').value.trim();
  const mo=Number(document.getElementById('tx-monto').value);
  const dt=document.getElementById('tx-fecha').value;
  if(!desc){alert('Ingresa una descripción');return;}
  if(!mo||mo<=0){alert('Ingresa un monto válido');return;}
  if(!dt){alert('Selecciona una fecha');return;}
  const cur=mk();if(!S.meses[cur])S.meses[cur]={txns:[]};
  if(txEditId){const idx=S.meses[cur].txns.findIndex(t=>t.id===txEditId);if(idx>=0)S.meses[cur].txns[idx]={...S.meses[cur].txns[idx],desc,mo,dt,tp:txType,cat:txType==='Gasto'?selCat:'ingreso'};}
  else{S.meses[cur].txns.push({id:Date.now()+Math.random().toString(36).slice(2,5),desc,mo,dt,tp:txType,cat:txType==='Gasto'?selCat:'ingreso'});}
  save();closeModal('m-tx');render();
}

function delTx(id){
  if(!confirm('¿Eliminar esta transacción?'))return;
  const cur=mk();if(S.meses[cur])S.meses[cur].txns=S.meses[cur].txns.filter(t=>t.id!==id);
  save();render();
}

let cfgDraft=null,cTab='ing';

function openCfg(){cfgDraft=JSON.parse(JSON.stringify(S.config));cTab='ing';switchCfgTab('ing');openModal('m-cfg');}

function cfgTab(t){cTab=t;switchCfgTab(t);}

function switchCfgTab(t){
  cTab=t;
  document.querySelectorAll('.cfg-tab').forEach((el,i)=>{el.classList.toggle('on',['ing','fij','deu','pre','qui'][i]===t);});
  renderCfgBody();
}

function renderCfgBody(){
  const el=document.getElementById('cfg-body');if(!el||!cfgDraft)return;
  switch(cTab){
    case'ing':
      const qOn=cfgDraft.quincenas?.activo;
      if(qOn){
        el.innerHTML=`<div style="background:rgba(191,90,242,.08);border:1px solid rgba(191,90,242,.2);border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px;color:var(--text2)">💜 Modo quincenas activo — los ingresos se configuran en la pestaña <strong style="color:var(--purple)">Quincenas</strong></div>`;
      } else {
        el.innerHTML=`<div>${(cfgDraft.ingresos||[]).map((x,i)=>`<div class="cfg-row"><input class="finput cfg-nm" placeholder="Fuente" value="${esc(x.n)}" oninput="cfgDraft.ingresos[${i}].n=this.value"><input class="finput cfg-amt" type="number" inputmode="decimal" placeholder="0" value="${x.m||''}" oninput="cfgDraft.ingresos[${i}].m=+this.value||0"><button class="cfg-del" onclick="cfgDel('ingresos',${i})">×</button></div>`).join('')}</div><button class="btn-add" onclick="cfgAdd('ingresos')">+ Agregar ingreso</button>`;
      }
      break;
    case'fij':{
      const qA=cfgDraft.quincenas?.activo;
      const qSel=(val,i,fn)=>qA?`<div style="display:flex;gap:4px;flex-shrink:0"><button onclick="${fn}(${i},'q1')" style="padding:3px 8px;border-radius:8px;border:1px solid ${val==='q1'?'var(--blue)':'var(--chip-b)'};background:${val==='q1'?'rgba(10,132,255,.2)':'var(--chip-bg)'};color:${val==='q1'?'var(--blue)':'var(--text2)'};font-size:11px;font-weight:700;cursor:pointer">Q1</button><button onclick="${fn}(${i},'q2')" style="padding:3px 8px;border-radius:8px;border:1px solid ${val==='q2'?'var(--purple)':'var(--chip-b)'};background:${val==='q2'?'rgba(191,90,242,.2)':'var(--chip-bg)'};color:${val==='q2'?'var(--purple)':'var(--text2)'};font-size:11px;font-weight:700;cursor:pointer">Q2</button></div>`:'';
      el.innerHTML=`${qA?`<div style="font-size:11px;color:var(--text2);margin-bottom:10px">Marca cada gasto en qué quincena se paga</div>`:''}${(cfgDraft.gastosFijos||[]).map((x,i)=>`<div class="cfg-row">${qSel((x.q||'q1'),i,'cfgFijQ')}<input class="finput cfg-nm" placeholder="Gasto fijo" value="${esc(x.n)}" oninput="cfgDraft.gastosFijos[${i}].n=this.value"><input class="finput cfg-amt" type="number" inputmode="decimal" placeholder="0" value="${x.m||''}" oninput="cfgDraft.gastosFijos[${i}].m=+this.value||0"><button class="cfg-del" onclick="cfgDel('fijos',${i})">×</button></div>`).join('')}<button class="btn-add" onclick="cfgAdd('fijos')">+ Agregar gasto fijo</button>`;
      break;}
    case'deu':{
      const qA=cfgDraft.quincenas?.activo;
      const qSel=(val,i,fn)=>qA?`<div style="display:flex;gap:4px;flex-shrink:0"><button onclick="${fn}(${i},'q1')" style="padding:3px 8px;border-radius:8px;border:1px solid ${val==='q1'?'var(--blue)':'var(--chip-b)'};background:${val==='q1'?'rgba(10,132,255,.2)':'var(--chip-bg)'};color:${val==='q1'?'var(--blue)':'var(--text2)'};font-size:11px;font-weight:700;cursor:pointer">Q1</button><button onclick="${fn}(${i},'q2')" style="padding:3px 8px;border-radius:8px;border:1px solid ${val==='q2'?'var(--purple)':'var(--chip-b)'};background:${val==='q2'?'rgba(191,90,242,.2)':'var(--chip-bg)'};color:${val==='q2'?'var(--purple)':'var(--text2)'};font-size:11px;font-weight:700;cursor:pointer">Q2</button></div>`:'';
      el.innerHTML=`${qA?`<div style="font-size:11px;color:var(--text2);margin-bottom:10px">Marca cada cuota en qué quincena se paga</div>`:''}${(cfgDraft.deudas||[]).map((x,i)=>`<div class="cfg-row">${qSel((x.q||'q1'),i,'cfgDeuQ')}<input class="finput cfg-nm" placeholder="Deuda" value="${esc(x.n)}" oninput="cfgDraft.deudas[${i}].n=this.value"><input class="finput cfg-amt" type="number" inputmode="decimal" placeholder="Cuota" value="${x.c||''}" oninput="cfgDraft.deudas[${i}].c=+this.value||0"><button class="cfg-del" onclick="cfgDel('deudas',${i})">×</button></div>`).join('')}<button class="btn-add" onclick="cfgAdd('deudas')">+ Agregar deuda</button>`;
      break;}
    case'pre':
      const p=cfgDraft.presup||{};
      el.innerHTML=`<div style="font-size:12px;color:var(--text2);margin-bottom:12px">Disponible Real: <strong style="color:var(--green)">${fmt(dispReal())}</strong></div>`+CATS.filter(c=>c.k!=='otro').map(c=>`<div class="fgroup"><label class="flbl">${c.ic} ${c.l}</label><input class="finput" type="number" inputmode="decimal" placeholder="0" value="${p[c.k]||''}" oninput="cfgDraft.presup['${c.k}']=+this.value||0"></div>`).join('');break;
    case'qui':{
      const qc=cfgDraft.quincenas||{activo:false,q1:0,q2:0};
      const on=qc.activo;
      el.innerHTML=`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px;background:${on?'rgba(191,90,242,.12)':'var(--card)'};border:1px solid ${on?'rgba(191,90,242,.3)':'var(--card-b)'};border-radius:14px;margin-bottom:16px">
          <div><div style="font-size:15px;font-weight:700">Plan de Quincenas</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${on?'Activo — ingresos divididos por quincena':'Inactivo — usa ingresos mensuales normales'}</div></div>
          <div onclick="cfgToggleQ()" style="width:50px;height:28px;border-radius:14px;background:${on?'var(--purple)':'var(--chip-bg)'};border:1px solid ${on?'var(--purple)':'var(--chip-b)'};cursor:pointer;position:relative;transition:background .2s">
            <div style="position:absolute;top:3px;${on?'right:3px':'left:3px'};width:22px;height:22px;border-radius:50%;background:#fff;transition:all .2s"></div>
          </div>
        </div>
        ${on?`
        <div style="font-size:11px;color:var(--text2);margin-bottom:12px">Ingresa cuánto recibes en cada quincena</div>
        <div class="fgroup">
          <label class="flbl" style="color:var(--blue)">1ª Quincena (días 1–15)</label>
          <input class="finput" type="number" inputmode="decimal" placeholder="0" value="${qc.q1||''}" oninput="cfgDraft.quincenas.q1=+this.value||0" style="border-color:rgba(10,132,255,.4)">
        </div>
        <div class="fgroup">
          <label class="flbl" style="color:var(--purple)">2ª Quincena (días 16–fin)</label>
          <input class="finput" type="number" inputmode="decimal" placeholder="0" value="${qc.q2||''}" oninput="cfgDraft.quincenas.q2=+this.value||0" style="border-color:rgba(191,90,242,.4)">
        </div>
        <div style="padding:12px;background:rgba(10,132,255,.07);border:1px solid rgba(10,132,255,.15);border-radius:12px;font-size:12px;color:var(--text2);line-height:1.6">
          💡 Luego ve a <strong>Gastos Fijos</strong> y <strong>Deudas</strong> para marcar en qué quincena se paga cada uno.<br>Así la app calcula cuánto te queda libre en cada mitad del mes.
        </div>
        `:`<div style="font-size:13px;color:var(--text3);text-align:center;padding:20px 0">Activa el plan de quincenas para dividir tus ingresos y gastos entre la primera y segunda mitad del mes.</div>`}
      `;break;}

  }
}

function cfgAdd(s){if(s==='ingresos')cfgDraft.ingresos.push({n:'',m:0});if(s==='fijos')cfgDraft.gastosFijos.push({n:'',m:0,q:'q1'});if(s==='deudas')cfgDraft.deudas.push({n:'',c:0,q:'q1'});renderCfgBody();}
function cfgDel(s,i){if(s==='ingresos')cfgDraft.ingresos.splice(i,1);if(s==='fijos')cfgDraft.gastosFijos.splice(i,1);if(s==='deudas')cfgDraft.deudas.splice(i,1);renderCfgBody();}
function cfgFijQ(i,q){cfgDraft.gastosFijos[i].q=q;renderCfgBody();}
function cfgDeuQ(i,q){cfgDraft.deudas[i].q=q;renderCfgBody();}
function cfgToggleQ(){if(!cfgDraft.quincenas)cfgDraft.quincenas={activo:false,q1:0,q2:0};cfgDraft.quincenas.activo=!cfgDraft.quincenas.activo;renderCfgBody();}
function saveCfg(){S.config=JSON.parse(JSON.stringify(cfgDraft));save();closeModal('m-cfg');render();}

function openModal(id){const ov=document.getElementById(id);ov.classList.add('on');document.body.classList.add('modal-open');ov.onclick=e=>{if(e.target===ov)closeModal(id);};}
function closeModal(id){document.getElementById(id).classList.remove('on');document.body.classList.remove('modal-open');}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();const ts=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href=url;a.download=`finanzas_backup_${ts}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed.config||!parsed.meses)throw new Error('Formato inválido');
      if(confirm(`¿Restaurar datos del backup? Esto reemplazará los datos actuales.\n\nBackup contiene ${Object.keys(parsed.archivos||{}).length} meses archivados.`)){
        S={...defState(),...parsed};S.config={...defState().config,...parsed.config};
        save();closeModal('m-cfg');render();alert('✅ Datos restaurados correctamente');
      }
    }catch(err){alert('Error al importar: el archivo no parece ser un backup válido.');}
    input.value='';
  };
  reader.readAsText(file);
}

load();checkArchive();render();
</script>
